<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Escáner Pro - Carga Fiorino</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #101216;
            --card: #1b1f27;
            --card-2: #252b36;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --green: #15803d;
            --amber: #b45309;
            --purple: #6d28d9;
            --red: #b91c1c;
            --blue: #2563eb;
            --border: #303746;
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px 12px 40px;
            -webkit-tap-highlight-color: transparent;
        }

        .container { max-width: 460px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header h1 { font-size: 1.12rem; margin: 0; font-weight: 700; }
        .header-actions { display: flex; gap: 6px; }

        .btn-icon {
            background: var(--card-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 9px;
            font-size: 0.81rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-icon.activo { background: #eab308; color: #000; border-color: #eab308; }
        .btn-icon.peligro { color: #fca5a5; }

        .progreso-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 12px;
            margin-bottom: 10px;
        }
        .progreso-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .barra-bg {
            width: 100%;
            height: 9px;
            background: #2d3340;
            border-radius: 999px;
            overflow: hidden;
        }
        .barra-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            transition: width 0.25s ease;
        }

        /* Selector de Modo de Escaneo */
        .modo-switch {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .modo-btn {
            flex: 1;
            padding: 9px 8px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--muted);
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
        }
        .modo-btn.activo-secuencia {
            background: #1d4ed8;
            color: #fff;
            border-color: #3b82f6;
        }
        .modo-btn.activo-atras {
            background: #7c3aed;
            color: #fff;
            border-color: #a78bfa;
        }

        /* Escáner */
        .scanner-wrap {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border);
            margin-bottom: 10px;
            transition: border-color 0.2s ease;
        }
        .scanner-wrap.modo-atras-borde { border-color: #a78bfa; }
        #scannerWrap.modo-selfie #reader video {
            transform: scaleX(-1) !important;
        }
        #reader { width: 100%; min-height: 215px; }
        .scanner-controls {
            display: flex;
            gap: 6px;
            padding: 8px;
            background: var(--card);
            border-top: 1px solid var(--border);
        }
        .scanner-controls button { flex: 1; }

        /* Tarjeta de Resultado */
        #resultado {
            border-radius: 12px;
            padding: 15px 14px;
            margin-bottom: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            text-align: center;
            transition: background 0.15s ease;
        }
        #resultado.verde { background: var(--green); border-color: #22c55e; }
        #resultado.ambar { background: var(--amber); border-color: #f59e0b; }
        #resultado.morado { background: var(--purple); border-color: #c4b5fd; }
        #resultado.rojo { background: var(--red); border-color: #ef4444; }

        .res-top {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .parada-num { font-size: 2rem; font-weight: 900; letter-spacing: -0.5px; line-height: 1.1; }
        .zona-badge {
            font-size: 0.82rem;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
        }
        .estado-tag {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.28);
        }
        .badge-atras-grande {
            display: block;
            margin-top: 8px;
            padding: 7px 10px;
            border-radius: 8px;
            background: #f97316;
            color: #fff;
            font-weight: 900;
            font-size: 0.95rem;
            border: 1px solid #fed7aa;
        }
        .alertas-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }
        .alerta-pill {
            font-size: 0.74rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            background: #fef08a;
            color: #422006;
        }
        .alerta-pill.nota { background: #fed7aa; color: #431407; }
        .alerta-pill.pin { background: #fecaca; color: #7f1d1d; }

        .info-bultos {
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.28);
            font-size: 0.96rem;
            font-weight: 700;
            color: #fef08a;
        }
        .bultos-paradas {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-top: 6px;
        }
        .chip-parada {
            font-size: 0.78rem;
            padding: 2px 7px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
        }
        .chip-parada.ok {
            background: #22c55e;
            color: #052e16;
            font-weight: 800;
        }
        .info-direccion {
            margin-top: 10px;
            font-size: 0.95rem;
            line-height: 1.35;
            font-weight: 600;
            color: #fff;
        }
        .info-bairro {
            margin-top: 3px;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.85);
        }
        .info-guia {
            margin-top: 6px;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.78);
            font-family: monospace;
        }

        .quick-actions {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }
        .btn-mini {
            background: rgba(0, 0, 0, 0.32);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 6px;
            padding: 5px 9px;
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-mini.copiado { background: #fef08a; color: #000; border-color: #fef08a; }
        .btn-mini.atras-on { background: #f97316; border-color: #fed7aa; }

        /* Paneles inferiores */
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .panel label.titulo {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--muted);
        }
        .file-group { margin-bottom: 10px; }
        .file-group:last-of-type { margin-bottom: 0; }

        input[type="text"], input[type="file"], select {
            width: 100%;
            background: var(--card-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 10px;
            font-size: 0.92rem;
        }
        .export-box {
            display: none;
            margin-top: 8px;
            padding: 10px;
            border-radius: 8px;
            background: var(--card-2);
            border: 1px solid var(--border);
        }
        .export-box.visible { display: block; }
        .export-radios {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
            font-size: 0.82rem;
        }
        .export-radios label {
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
        }
        .resumen-sin-gps {
            font-size: 0.78rem;
            color: #fde047;
            margin-bottom: 8px;
            display: none;
            line-height: 1.35;
        }
        .resumen-sin-gps.visible { display: block; }
        .export-actions {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .btn-export {
            width: 100%;
            background: #1d4ed8;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-auditar {
            width: 100%;
            background: #0f766e;
            color: #fff;
            border: 1px solid #14b8a6;
            border-radius: 8px;
            padding: 9px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-export:disabled, .btn-auditar:disabled { opacity: 0.6; cursor: wait; }

        .busqueda-resultados {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .busqueda-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: var(--card-2);
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.84rem;
        }
        .busqueda-item button {
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 7px 10px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }
        .estado-carga {
            margin-top: 8px;
            font-size: 0.83rem;
            color: var(--muted);
            line-height: 1.4;
        }
        .alerta-omision {
            display: none;
            margin-top: 8px;
            padding: 9px 10px;
            border-radius: 8px;
            background: rgba(185, 28, 28, 0.25);
            border: 1px solid #ef4444;
            color: #fecaca;
            font-size: 0.81rem;
            line-height: 1.35;
        }
        .alerta-omision.visible { display: block; }

        .alerta-pines {
            display: none;
            margin-top: 8px;
            border-radius: 8px;
            background: rgba(180, 83, 9, 0.22);
            border: 1px solid #f59e0b;
            color: #fde68a;
            font-size: 0.81rem;
            overflow: hidden;
        }
        .alerta-pines.visible { display: block; }
        .alerta-pines summary {
            padding: 9px 10px;
            cursor: pointer;
            font-weight: 700;
            list-style: none;
        }
        .alerta-pines summary::-webkit-details-marker { display: none; }
        .alerta-pines-body {
            padding: 8px 10px;
            border-top: 1px solid rgba(245, 158, 11, 0.4);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .pines-toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(245, 158, 11, 0.25);
        }
        .pin-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(0, 0, 0, 0.28);
            padding: 8px;
            border-radius: 7px;
            border: 1px solid rgba(245, 158, 11, 0.25);
        }
        .pin-row-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }
        .pin-row-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .pin-btn-map {
            background: #b45309;
            color: #fff;
            text-decoration: none;
            padding: 4px 7px;
            border-radius: 5px;
            font-weight: 700;
            font-size: 0.72rem;
            text-align: center;
            white-space: nowrap;
        }
        .pin-btn-map.gps { background: #1d4ed8; }
        .pin-btn-map.nuevo { background: #15803d; }
        .pin-select {
            padding: 6px 8px;
            font-size: 0.78rem;
            border-radius: 6px;
            background: #111827;
            border: 1px solid #4b5563;
            color: #f3f4f6;
        }

        /* Modal Lista de Control */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            padding: 12px;
        }
        .modal-backdrop.abierto {
            display: flex;
            justify-content: center;
            align-items: stretch;
        }
        .modal-box {
            width: 100%;
            max-width: 460px;
            height: 100%;
            max-height: calc(100dvh - 24px);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .tab-btn {
            flex: 1;
            background: var(--card-2);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 3px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
        }
        .tab-btn.activa { background: var(--blue); color: #fff; border-color: var(--blue); }
        #filtroModal { flex-shrink: 0; }

        .lista-items {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            display: block;
            margin-top: 10px;
            padding-right: 2px;
        }
        .lista-row {
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.84rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .lista-row-info {
            flex: 1 1 auto;
            min-width: 0;
            word-break: break-word;
            line-height: 1.35;
        }
        .lista-row small { color: var(--muted); display: block; margin-top: 3px; font-family: monospace; }

        .multi-group {
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .multi-group summary {
            padding: 10px 12px;
            cursor: pointer;
            list-style: none;
            font-size: 0.86rem;
            line-height: 1.35;
        }
        .multi-group summary::-webkit-details-marker { display: none; }
        .multi-summary-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: #fde047;
            margin-bottom: 3px;
        }
        .multi-summary-sub {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 3px;
        }
        .multi-group-body {
            border-top: 1px solid var(--border);
            padding: 8px;
            background: #151921;
        }
        .multi-group-body .lista-row {
            background: var(--card);
            margin-bottom: 6px;
        }
        .multi-group-body .lista-row:last-child { margin-bottom: 0; }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>Escáner Fiorino Pro</h1>
        <div class="header-actions">
            <button id="btnSonido" class="btn-icon activo" onclick="toggleSonido()">🔊 Voz</button>
            <button class="btn-icon" onclick="abrirModal()">📋 Lista</button>
        </div>
    </div>

    <div class="progreso-box">
        <div class="progreso-top">
            <span id="txtProgreso">Cargados: 0 / 0</span>
            <span id="txtPorcentaje">0%</span>
        </div>
        <div class="barra-bg">
            <div id="barraFill" class="barra-fill"></div>
        </div>
    </div>

    <div class="modo-switch">
        <button id="btnModoSecuencia" class="modo-btn activo-secuencia" onclick="cambiarModoEscaneo('secuencia')">
            🔍 Secuencia
        </button>
        <button id="btnModoAtras" class="modo-btn" onclick="cambiarModoEscaneo('atras')">
            📦 Va Atrás (<span id="countAtrasBtn">0</span>)
        </button>
    </div>

    <div id="scannerWrap" class="scanner-wrap">
        <div id="reader"></div>
        <div class="scanner-controls">
            <button id="btnLinterna" class="btn-icon" onclick="toggleLinterna()">🔦 Linterna</button>
            <button id="btnCamara" class="btn-icon" onclick="toggleCamaraFrontal()">🤳 Selfie</button>
            <button id="btnPausa" class="btn-icon" onclick="togglePausaCamara()">⏸️ Pausar</button>
        </div>
    </div>

    <div id="resultado">
        <div style="font-size:1.1rem; font-weight:700;">Esperando escaneo...</div>
        <div class="info-guia">Apunta a cualquiera de los 3 QR o al código de barras</div>
    </div>

    <div class="panel">
        <label class="titulo" for="busquedaManual">Búsqueda rápida (últimos dígitos, calle, barrio o bloque):</label>
        <input type="text" id="busquedaManual" placeholder="Ej: 188X, Rubi o 221" oninput="buscarManual(this.value)">
        <div id="busquedaResultados" class="busqueda-resultados"></div>
    </div>

    <div class="panel">
        <div class="file-group">
            <label class="titulo" for="subirPdf">1. PDF de Routin (Orden de paradas):</label>
            <input type="file" id="subirPdf" accept="application/pdf" onchange="cargarPDF(event)">
        </div>
        <div class="file-group">
            <label class="titulo" for="subirExcel">2. Excel de Shopee .xlsx / .csv (GPS, notas y limpiar para Routin):</label>
            <input type="file" id="subirExcel" onchange="cargarExcel(event)">
            <div id="exportBox" class="export-box">
                <div class="export-radios">
                    <label>
                        <input type="radio" name="metodoExport" value="clasico" checked>
                        <span><strong>Método Clásico:</strong> 1 parada por paquete</span>
                    </label>
                    <label>
                        <input type="radio" name="metodoExport" value="agrupado">
                        <span><strong>Método Agrupado:</strong> 1 parada por dirección en Routin</span>
                    </label>
                </div>
                <div id="resumenAccionesPin" class="resumen-sin-gps"></div>
                <div class="export-actions">
                    <button id="btnAuditarOnline" class="btn-auditar" onclick="auditarCallesOnline()">
                        🌐 Auditar y sugerir correcciones (Online)
                    </button>
                    <button id="btnExportarLimpio" class="btn-export" onclick="descargarExcelLimpio()">
                        ⬇️ Descargar Excel limpio para Routin
                    </button>
                </div>
            </div>
        </div>
        <div id="estadoCarga" class="estado-carga">Esperando archivos...</div>
        <div id="alertaOmision" class="alerta-omision"></div>
        <details id="alertaPines" class="alerta-pines">
            <summary id="alertaPinesResumen">⚠️ Pines sospechosos</summary>
            <div id="alertaPinesBody" class="alerta-pines-body"></div>
        </details>
        <div style="margin-top:10px; display:flex; justify-content:flex-end;">
            <button class="btn-icon peligro" onclick="limpiarTodo()">🗑️ Nuevo día (Limpiar todo)</button>
        </div>
    </div>

</div>

<!-- Modal Lista de Control -->
<div id="modalLista" class="modal-backdrop" onclick="if(event.target === this) cerrarModal()">
    <div class="modal-box">
        <div class="modal-header">
            <strong style="font-size:1rem;">Control de Ruta</strong>
            <button class="btn-icon" onclick="cerrarModal()">✖ Cerrar</button>
        </div>
        <div class="tabs">
            <button class="tab-btn activa" id="tabFaltantes" onclick="cambiarTab('faltantes')">Faltan</button>
            <button class="tab-btn" id="tabCargados" onclick="cambiarTab('cargados')">Listos</button>
            <button class="tab-btn" id="tabMulti" onclick="cambiarTab('multi')">Multi</button>
            <button class="tab-btn" id="tabAtras" onclick="cambiarTab('atras')">Atrás</button>
        </div>
        <input type="text" id="filtroModal" placeholder="Filtrar por parada, calle, bloque o BR..." oninput="renderizarListaModal()">
        <div id="listaModalContenido" class="lista-items"></div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ---------------- ESTADO GLOBAL PERSISTENTE ----------------
    const STORAGE_PDF = "escaner_fiorino_pdf_v4";
    const STORAGE_EXCEL = "escaner_fiorino_excel_v4";
    const STORAGE_SCAN = "escaner_fiorino_scan_v4";

    function hablar(texto) {
        if (modoAudio !== "voz" || !("speechSynthesis" in window)) return;
        try {
            if (window.speechSynthesis.paused) window.speechSynthesis.resume();
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(texto);
            u.lang = "es-ES";
            u.rate = 1.15;
            u.pitch = 1;
            u.volume = 1;
            window.speechSynthesis.speak(u);
        } catch (e) {}
    }

    function emitirBeep(tipo) {
        if (modoAudio === "mudo" || !audioCtx) return;
        if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});

        const tocar = (freq, dur, delay = 0, wave = "sine") => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = wave;
            osc.frequency.value = freq;
            const start = audioCtx.currentTime + delay;
            gain.gain.setValueAtTime(0.28, start);
            gain.gain.exponentialRampToValueAtTime(0.01, start + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(start);
            osc.stop(start + dur);
        };

        if (tipo === "ok") tocar(920, 0.12);
        else if (tipo === "multi") { tocar(900, 0.1, 0); tocar(1240, 0.15, 0.13); }
        else if (tipo === "atras") { tocar(740, 0.09, 0, "triangle"); tocar(980, 0.14, 0.11, "triangle"); }
        else if (tipo === "duplicado") { tocar(520, 0.1, 0, "triangle"); tocar(420, 0.12, 0.13, "triangle"); }
        else if (tipo === "error") tocar(210, 0.35, 0, "sawtooth");
    }

    // ---------------- CARGA DE EXCEL SHOPEE ----------------
    function validarCoordenada(rawStr) {
        const strLimpia = String(rawStr || "").replace(",", ".").trim();
        const num = parseFloat(strLimpia);
        if (!Number.isFinite(num) || num === 0 || Math.abs(num) < 1) {
            return { val: null, bajaPrecision: true };
        }
        const partes = strLimpia.split(".");
        const decimales = partes[1] ? partes[1].replace(/0+$/, "").length : 0;
        return { val: num, bajaPrecision: decimales <= 3 };
    }

    async function cargarExcel(e) {
        const archivo = e.target.files[0];
        if (!archivo) return;

        const estadoEl = document.getElementById("estadoCarga");
        if (!/\.(xlsx|xls|csv)$/i.test(archivo.name)) {
            estadoEl.innerText = "❌ Selecciona un archivo .xlsx, .xls o .csv de Shopee.";
            estadoEl.style.color = "#f87171";
            e.target.value = "";
            return;
        }

        estadoEl.innerText = "Leyendo planilla de Shopee...";
        estadoEl.style.color = "#9ca3af";

        try {
            if (typeof XLSX === "undefined") {
                throw new Error("Librería Excel no disponible. Recarga la página con internet una vez.");
            }
            const data = await archivo.arrayBuffer();
            const workbook = XLSX.read(data, { type: "array" });
            const sheetName = workbook.SheetNames[0];
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });

            mapaExcel.clear();
            mapaAccionPin.clear();

            for (const row of rows) {
                let tn = String(row["SPX TN"] || row["SPX_TN"] || row["TN"] || row["Código"] || "").trim().toUpperCase();
                if (!tn) {
                    for (const val of Object.values(row)) {
                        const m = String(val).match(/\b(BR[0-9A-Z]{13})\b/i);
                        if (m) { tn = m[1].toUpperCase(); break; }
                    }
                }
                if (!tn) continue;

                const seq = String(row["Sequence"] ?? "").trim();
                const stop = String(row["Stop"] ?? "").trim();
                const address = String(row["Destination Address"] || row["Address"] || row["Endereço"] || row["Dirección"] || "").trim();
                const bairro = String(row["Bairro"] || row["Neighborhood"] || "").replace(/-\s*$/, "").trim();
                const city = String(row["City"] || row["Cidade"] || "").trim();
                const zip = String(row["Zipcode/Postal code"] || row["CEP"] || row["Zipcode"] || "").trim();

                const latParsed = validarCoordenada(row["Latitude"] || row["Lat"]);
                const lonParsed = validarCoordenada(row["Longitude"] || row["Lon"] || row["Lng"]);

                const sinGPS = latParsed.val === null || lonParsed.val === null;
                const bajaPrec = latParsed.bajaPrecision || lonParsed.bajaPrecision;

                let motivoSospecha = "";
                if (sinGPS) motivoSospecha = "Sin GPS (0,0)";
                else if (bajaPrec) motivoSospecha = "Pin muy impreciso (≤3 dec.)";

                mapaExcel.set(tn, {
                    seq,
                    stop,
                    address,
                    bairro,
                    city,
                    zip,
                    lat: sinGPS ? null : latParsed.val,
                    lon: sinGPS ? null : lonParsed.val,
                    sugLat: null,
                    sugLon: null,
                    esPinSospechoso: sinGPS || bajaPrec,
                    motivoSospecha,
                    motivoOnline: ""
                });
            }

            if (mapaExcel.size === 0) {
                throw new Error("No se encontraron códigos BR válidos en esta planilla.");
            }

            analizarPinesSospechososOffline();
            reconstruirRutaActiva();
            guardarEstado();
            actualizarUIProgreso();
            actualizarEstadoCargaUI();
        } catch (err) {
            console.error(err);
            estadoEl.innerText = "❌ Error al leer Excel: " + err.message;
            estadoEl.style.color = "#f87171";
        } finally {
            e.target.value = "";
        }
    }

    // ---------------- DETECTOR OFFLINE DE PINES SOSPECHOSOS ----------------
    function analizarPinesSospechososOffline() {
        if (mapaExcel.size === 0) return;

        const porCalle = new Map();
        for (const [codigo, ex] of mapaExcel.entries()) {
            const p = parsearDireccionInteligente(ex.address, ex.zip);
            if (!p.calle || p.num === null || ex.lat === null || ex.lon === null) continue;
            const key = `${p.calle}|${(ex.city || "").toLowerCase()}`;
            if (!porCalle.has(key)) porCalle.set(key, []);
            porCalle.get(key).push({ codigo, ex, num: Number(p.num) });
        }

        const fallosPorCodigo = new Map();

        for (const lista of porCalle.values()) {
            if (lista.length < 2) continue;
            for (let i = 0; i < lista.length; i++) {
                for (let j = i + 1; j < lista.length; j++) {
                    const A = lista[i], B = lista[j];
                    const diffNum = Math.abs(A.num - B.num);
                    if (diffNum < 60) continue;

                    const dist = distanciaMetros(A.ex.lat, A.ex.lon, B.ex.lat, B.ex.lon);
                    if (dist > 6000) continue;

                    const discrepancia = Math.abs(dist - diffNum);
                    if (discrepancia >= 120 && (dist < diffNum * 0.55 || dist > diffNum * 1.65 + 50)) {
                        fallosPorCodigo.set(A.codigo, (fallosPorCodigo.get(A.codigo) || 0) + 1);
                        fallosPorCodigo.set(B.codigo, (fallosPorCodigo.get(B.codigo) || 0) + 1);
                    }
                }
            }
        }

        for (const lista of porCalle.values()) {
            if (lista.length < 2) continue;
            const conFallos = lista.filter(x => (fallosPorCodigo.get(x.codigo) || 0) > 0);
            if (conFallos.length === 0) continue;

            if (lista.length >= 3) {
                let maxFallo = 0;
                for (const x of conFallos) {
                    const f = fallosPorCodigo.get(x.codigo) || 0;
                    if (f > maxFallo) maxFallo = f;
                }
                for (const x of conFallos) {
                    const f = fallosPorCodigo.get(x.codigo) || 0;
                    if (f === maxFallo && f >= Math.ceil((lista.length - 1) * 0.5)) {
                        x.ex.esPinSospechoso = true;
                        x.ex.motivoSospecha = x.ex.motivoSospecha || "Pin fuera de línea en la calle";
                    } else if (f === 1 && maxFallo >= 2) {
                        continue;
                    } else if (f > 0 && maxFallo === 1) {
                        x.ex.esPinSospechoso = true;
                        x.ex.motivoSospecha = x.ex.motivoSospecha || "Desvío métrico en calle";
                    }
                }
            } else {
                for (const x of conFallos) {
                    x.ex.esPinSospechoso = true;
                    x.ex.motivoSospecha = x.ex.motivoSospecha || "Desvío métrico en calle";
                }
            }
        }

        recompilarListaSospechosos();
    }

    // ---------------- AUDITORÍA Y AUTOCORRECCIÓN ONLINE (OVERPASS POR GET SIMPLE) ----------------
    function normalizarCalleComparacion(texto) {
        let s = String(texto || "")
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .toLowerCase();

        s = s
            .replace(/\br\.?\s+/g, "rua ")
            .replace(/\bav\.?\s+/g, "avenida ")
            .replace(/\btv\.?\s+/g, "travessa ")
            .replace(/\bal\.?\s+/g, "alameda ")
            .replace(/\best\.?\s+/g, "estrada ")
            .replace(/\brod\.?\s+/g, "rodovia ")
            .replace(/\bpca\.?\s+/g, "praca ")
            .replace(/\bdr\.?\s+/g, "doutor ")
            .replace(/\bdra\.?\s+/g, "doutora ")
            .replace(/\bprofa?\.?\s+/g, "professor ")
            .replace(/\bprofessora\b/g, "professor")
            .replace(/\bver\.?\s+/g, "vereador ")
            .replace(/\bpe\.?\s+/g, "padre ")
            .replace(/\bpres\.?\s+/g, "presidente ")
            .replace(/\bcel\.?\s+/g, "coronel ")
            .replace(/\bcomend\.?\s+/g, "comendador ")
            .replace(/\bgov\.?\s+/g, "governador ")
            .replace(/\bdep\.?\s+/g, "deputado ")
            .replace(/\bsta\.?\s+/g, "santa ")
            .replace(/\bsto\.?\s+/g, "santo ")
            .replace(/\bn\.?\s*sra\.?\s+/g, "nossa senhora ")
            .replace(/schimidt/g, "schmidt")
            .replace(/sampai\b/g, "sampaio");

        s = s
            .replace(/^(rua|avenida|travessa|alameda|rodovia|estrada|praca|largo|viela|beco)\s+/i, "")
            .replace(/[^a-z0-9\s]/g, " ")
            .replace(/\s+/g, " ")
            .trim();

        return s;
    }

    function puntoMasCercanoEnPolilineas(lat, lon, arrayPolilineas) {
        const mLat = 111320;
        const mLon = 111320 * Math.cos(lat * Math.PI / 180);

        let mejorDist = Infinity;
        let mejorLat = lat;
        let mejorLon = lon;

        for (const poly of arrayPolilineas) {
            for (let i = 0; i < poly.length - 1; i++) {
                const A = poly[i], B = poly[i + 1];
                const ax = (A.lon - lon) * mLon;
                const ay = (A.lat - lat) * mLat;
                const bx = (B.lon - lon) * mLon;
                const by = (B.lat - lat) * mLat;

                const dx = bx - ax;
                const dy = by - ay;
                const len2 = dx * dx + dy * dy;

                let t = 0;
                if (len2 > 0) {
                    t = -((ax * dx + ay * dy) / len2);
                    if (t < 0) t = 0;
                    else if (t > 1) t = 1;
                }

                const cx = ax + t * dx;
                const cy = ay + t * dy;
                const d = Math.sqrt(cx * cx + cy * cy);

                if (d < mejorDist) {
                    mejorDist = d;
                    mejorLat = A.lat + t * (B.lat - A.lat);
                    mejorLon = A.lon + t * (B.lon - A.lon);
                }
            }
        }

        return { dist: mejorDist, lat: mejorLat, lon: mejorLon };
    }

    async function consultarOverpassConRespaldo(query, btn) {
        const endpoints = [
            "https://overpass-api.de/api/interpreter",
            "https://overpass.private.coffee/api/interpreter",
            "https://z.overpass-api.de/api/interpreter",
            "https://lz4.overpass-api.de/api/interpreter"
        ];
        const errores = [];

        for (let i = 0; i < endpoints.length; i++) {
            const base = endpoints[i];
            const host = new URL(base).hostname;
            if (btn) btn.innerText = `🌐 Conectando (${i + 1}/${endpoints.length})...`;

            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 22000);
            try {
                // GET simple sin headers personalizados evita bloqueo CORS preflight (HTTP 406)
                const url = `${base}?data=${encodeURIComponent(query)}`;
                const res = await fetch(url, { method: "GET", signal: ctrl.signal });
                clearTimeout(timer);
                if (res.ok) {
                    const json = await res.json();
                    if (json && Array.isArray(json.elements)) return json;
                }
                errores.push(`${host}: HTTP ${res.status}`);
            } catch (e) {
                clearTimeout(timer);
                errores.push(`${host}: ${e.name === "AbortError" ? "Tiempo agotado" : "Error red"}`);
            }
        }
        throw new Error(`Servidores ocupados (${errores.join(" | ")})`);
    }

    async function auditarCallesOnline() {
        if (mapaExcel.size === 0) return;
        if (!navigator.onLine) {
            alert("Necesitas conexión a internet para ejecutar la auditoría online de calles.");
            return;
        }

        const btn = document.getElementById("btnAuditarOnline");
        const estadoEl = document.getElementById("estadoCarga");
        const txtOrig = btn.innerText;
        btn.disabled = true;

        try {
            const coordsValidas = Array.from(mapaExcel.values())
                .filter(ex => ex.lat !== null && ex.lon !== null)
                .map(ex => ({ lat: ex.lat, lon: ex.lon }));

            if (coordsValidas.length === 0) {
                throw new Error("No hay coordenadas válidas en el Excel para delimitar la zona.");
            }

            const latsOrd = coordsValidas.map(c => c.lat).sort((a, b) => a - b);
            const lonsOrd = coordsValidas.map(c => c.lon).sort((a, b) => a - b);
            const medLat = latsOrd[Math.floor(latsOrd.length / 2)];
            const medLon = lonsOrd[Math.floor(lonsOrd.length / 2)];

            let minLat = medLat, maxLat = medLat, minLon = medLon, maxLon = medLon;
            for (const c of coordsValidas) {
                if (Math.abs(c.lat - medLat) <= 0.15 && Math.abs(c.lon - medLon) <= 0.15) {
                    if (c.lat < minLat) minLat = c.lat;
                    if (c.lat > maxLat) maxLat = c.lat;
                    if (c.lon < minLon) minLon = c.lon;
                    if (c.lon > maxLon) maxLon = c.lon;
                }
            }
            const s = (minLat - 0.005).toFixed(5);
            const w = (minLon - 0.005).toFixed(5);
            const n = (maxLat + 0.005).toFixed(5);
            const e = (maxLon + 0.005).toFixed(5);

            const query = `[out:json][timeout:20];way["highway"]["name"](${s},${w},${n},${e});out geom;`;
            const osmData = await consultarOverpassConRespaldo(query, btn);

            btn.innerText = "🔍 Auditando pines contra calles...";
            const osmCalles = new Map();

            for (const el of osmData.elements) {
                if (!el.tags || !el.tags.name || !Array.isArray(el.geometry) || el.geometry.length < 2) continue;
                const nombreOriginal = el.tags.name;
                const normName = normalizarCalleComparacion(nombreOriginal);
                if (!normName) continue;

                if (!osmCalles.has(normName)) {
                    osmCalles.set(normName, { nombreOriginal, polilineas: [] });
                }
                osmCalles.get(normName).polilineas.push(el.geometry);
            }

            const listaOsmCalles = Array.from(osmCalles.entries());
            let detectadosParalela = 0;
            let estimadosCalle = 0;
            let reparadosSinGps = 0;

            for (const ex of mapaExcel.values()) {
                ex.sugLat = null;
                ex.sugLon = null;
                ex.motivoOnline = "";
            }

            for (const [codigo, ex] of mapaExcel.entries()) {
                const parsed = parsearDireccionInteligente(ex.address, ex.zip);
                const calleEsperadaNorm = normalizarCalleComparacion(ex.address.split(",")[0].split("-")[0]);

                let polilineasEsperadas = [];
                let nombreEsperadoOsm = "";
                if (calleEsperadaNorm) {
                    for (const [normName, info] of listaOsmCalles) {
                        if (normName === calleEsperadaNorm || similitudBigrams(normName, calleEsperadaNorm) >= 0.80) {
                            polilineasEsperadas.push(...info.polilineas);
                            if (!nombreEsperadoOsm) nombreEsperadoOsm = info.nombreOriginal;
                        }
                    }
                }

                // Caso A: Sin GPS (0,0)
                if (ex.lat === null || ex.lon === null) {
                    btn.innerText = "🔧 Buscando sin GPS...";
                    const coordNom = await buscarCoordenadaFaltanteOSM(ex);
                    if (coordNom) {
                        ex.sugLat = Number(coordNom.lat.toFixed(6));
                        ex.sugLon = Number(coordNom.lon.toFixed(6));
                        ex.motivoOnline = "Sin GPS (0,0) → Sugerencia OSM";
                        reparadosSinGps++;
                    } else if (polilineasEsperadas.length > 0) {
                        const seg = polilineasEsperadas[Math.floor(polilineasEsperadas.length / 2)];
                        const pt = seg[Math.floor(seg.length / 2)];
                        ex.sugLat = Number(pt.lat.toFixed(6));
                        ex.sugLon = Number(pt.lon.toFixed(6));
                        ex.motivoOnline = "Sin GPS (0,0) → Centro de calle OSM";
                        reparadosSinGps++;
                    }
                    continue;
                }

                // Caso B: Pin en calle paralela o transversal
                if (polilineasEsperadas.length > 0) {
                    const proyEsperada = puntoMasCercanoEnPolilineas(ex.lat, ex.lon, polilineasEsperadas);

                    let calleMasCercana = "";
                    let normMasCercana = "";
                    let distMasCercana = Infinity;

                    for (const [normName, info] of listaOsmCalles) {
                        const p0 = info.polilineas[0][0];
                        if (Math.abs(p0.lat - ex.lat) > 0.015 || Math.abs(p0.lon - ex.lon) > 0.015) continue;

                        const res = puntoMasCercanoEnPolilineas(ex.lat, ex.lon, info.polilineas);
                        if (res.dist < distMasCercana) {
                            distMasCercana = res.dist;
                            calleMasCercana = info.nombreOriginal;
                            normMasCercana = normName;
                        }
                    }

                    const simCercana = similitudBigrams(normMasCercana, calleEsperadaNorm);

                    if (proyEsperada.dist >= 28 && proyEsperada.dist <= 260 && distMasCercana <= 22 && simCercana < 0.72) {
                        ex.esPinSospechoso = true;
                        ex.sugLat = Number(proyEsperada.lat.toFixed(6));
                        ex.sugLon = Number(proyEsperada.lon.toFixed(6));
                        ex.motivoOnline = `Cayó en ${calleMasCercana} (a ${Math.round(proyEsperada.dist)}m de ${nombreEsperadoOsm})`;
                        detectadosParalela++;
                        continue;
                    }
                }

                // Caso C: Desvío métrico a lo largo de la calle (ej: Rua Itália, 30)
                if (ex.esPinSospechoso && parsed.num !== null && !ex.motivoSospecha.includes("impreciso")) {
                    const paresBuenos = [];
                    for (const [otroCod, otroEx] of mapaExcel.entries()) {
                        if (otroCod === codigo || otroEx.esPinSospechoso || otroEx.lat === null) continue;
                        const pOtro = parsearDireccionInteligente(otroEx.address, otroEx.zip);
                        if (pOtro.calle === parsed.calle && pOtro.num !== null && Number(pOtro.num) !== Number(parsed.num)) {
                            paresBuenos.push({ num: Number(pOtro.num), lat: otroEx.lat, lon: otroEx.lon });
                        }
                    }

                    if (paresBuenos.length >= 2) {
                        const targetNum = Number(parsed.num);
                        paresBuenos.sort((a, b) => Math.abs(a.num - targetNum) - Math.abs(b.num - targetNum));
                        const p1 = paresBuenos[0];
                        const p2 = paresBuenos.find(x => Math.abs(x.num - p1.num) >= 40) || paresBuenos[1];

                        if (p1.num !== p2.num) {
                            const factor = (targetNum - p1.num) / (p1.num - p2.num);
                            let estLat = p1.lat + factor * (p1.lat - p2.lat);
                            let estLon = p1.lon + factor * (p1.lon - p2.lon);

                            if (polilineasEsperadas.length > 0) {
                                const snap = puntoMasCercanoEnPolilineas(estLat, estLon, polilineasEsperadas);
                                estLat = snap.lat;
                                estLon = snap.lon;
                            }
                            ex.sugLat = Number(estLat.toFixed(6));
                            ex.sugLon = Number(estLon.toFixed(6));
                            ex.motivoOnline = `${ex.motivoSospecha} → Estimado métrico listo`;
                            estimadosCalle++;
                        }
                    }
                }
            }

            recompilarListaSospechosos();
            reconstruirRutaActiva();
            guardarEstado();
            actualizarEstadoCargaUI();

            if (pinesSospechosos.length > 0) {
                document.getElementById("alertaPines").open = true;
            }

            const totalMejoras = detectadosParalela + estimadosCalle + reparadosSinGps;
            estadoEl.innerText = totalMejoras > 0
                ? `🌐 Auditoría lista (${osmCalles.size} calles): ${detectadosParalela} en calle paralela, ${estimadosCalle} estimado(s), ${reparadosSinGps} sin GPS.`
                : `🌐 Auditoría lista (${osmCalles.size} calles revisadas): no se detectaron desvíos graves.`;
            estadoEl.style.color = "#4ade80";
        } catch (err) {
            console.error(err);
            estadoEl.innerText = "⚠️ Auditoría online: " + err.message;
            estadoEl.style.color = "#fde047";
        } finally {
            btn.disabled = false;
            btn.innerText = txtOrig;
        }
    }

    // ---------------- ALGORITMO "SENTIDO COMÚN" (TEXTO + CEP + GPS + NÚMERO) ----------------
    function parsearDireccionInteligente(texto, zip = "") {
        let limpio = String(texto || "")
            .replace(/(\d)\.(\d)/g, "$1$2")
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .toLowerCase();

        limpio = limpio
            .replace(/^(rua|r\.|r|avenida|av\.|av|travessa|tv\.|alameda|al\.|rodovia|rod\.|estrada|est\.|praca|pca\.|largo|viela|beco)\s+/i, "")
            .trim();

        const partes = limpio.split(",");
        let calleRaw = partes[0] || "";
        let segNum = (partes[1] || "").trim();

        let num = null;
        if (partes.length >= 2) {
            if (/^s\s*\/?\s*n\b/i.test(segNum)) {
                num = null;
            } else {
                const mSeg = segNum.match(/^\s*(\d+)\b/);
                if (mSeg) num = mSeg[1];
            }
        } else {
            const sinComp = calleRaw.split(/\b(?:bloco|blo|bl|apto|ap|casa|sala|cond)\b/i)[0];
            const mEsp = sinComp.match(/^(.+?)\s+(\d+)\b/);
            if (mEsp) {
                calleRaw = mEsp[1];
                num = mEsp[2];
            }
        }

        const calleSinBairro = calleRaw
            .replace(/\s+bairro\s+[a-z0-9\s]+$/i, "")
            .split("-")[0];

        const limpiarTextoCalle = (s) => s
            .replace(/schimidt/g, "schmidt")
            .replace(/sampai\b/g, "sampaio")
            .replace(/[^a-z0-9\s]/g, " ")
            .replace(/\s+/g, " ")
            .trim();

        const calle = limpiarTextoCalle(calleSinBairro) || limpiarTextoCalle(calleRaw);
        const cepNorm = String(zip || "").replace(/\D/g, "");
        const cepValido = (cepNorm.length === 8 && !/000$/.test(cepNorm)) ? cepNorm : "";

        const esCalleGenerica = /^(um|dois|tres|quatro|cinco|seis|sete|oito|nove|dez|\d{1,2})$/.test(calle);
        const esCondominio = /\b(bloco|blo|bl\.?|apto|apartamento|ap\.?|cond|resid)\b/i.test(texto);

        return { calle, num, cepValido, esCalleGenerica, esCondominio };
    }

    function similitudBigrams(a, b) {
        if (!a || !b) return 0;
        if (a === b) return 1;
        if (a.length < 2 || b.length < 2) return 0;
        if (a.includes(b) || b.includes(a)) return 0.92;

        const getBigrams = (s) => {
            const set = new Map();
            for (let i = 0; i < s.length - 1; i++) {
                const bg = s.slice(i, i + 2);
                set.set(bg, (set.get(bg) || 0) + 1);
            }
            return set;
        };
        const bgA = getBigrams(a);
        const bgB = getBigrams(b);
        let inter = 0;
        for (const [bg, count] of bgA.entries()) {
            if (bgB.has(bg)) inter += Math.min(count, bgB.get(bg));
        }
        return (2 * inter) / ((a.length - 1) + (b.length - 1));
    }

    function distanciaMetros(lat1, lon1, lat2, lon2) {
        if (lat1 === null || lon1 === null || lat2 === null || lon2 === null) return Infinity;
        const R = 6371000;
        const toRad = (g) => g * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function construirGruposSentidoComun(listaItems) {
        const n = listaItems.length;
        const parsedList = listaItems.map(it => parsearDireccionInteligente(it.texto, it.zip));
        const padre = Array.from({ length: n }, (_, i) => i);
        const find = (x) => (padre[x] === x ? x : (padre[x] = find(padre[x])));
        const union = (a, b) => {
            const ra = find(a), rb = find(b);
            if (ra !== rb) padre[rb] = ra;
        };

        for (let i = 0; i < n; i++) {
            for (let j = i + 1; j < n; j++) {
                const A = listaItems[i], B = listaItems[j];
                const pA = parsedList[i], pB = parsedList[j];

                if (pA.num !== null && pB.num !== null && pA.num !== pB.num) continue;

                const sim = similitudBigrams(pA.calle, pB.calle);
                const dist = distanciaMetros(A.lat, A.lon, B.lat, B.lon);
                const mismoCep = Boolean(pA.cepValido && pA.cepValido === pB.cepValido);

                let sonMismoLugar = false;

                if (pA.num !== null && pA.num === pB.num) {
                    if (sim >= 0.72 || dist <= 45) {
                        sonMismoLugar = true;
                    } else if (mismoCep) {
                        if (dist <= 80) sonMismoLugar = true;
                        else if (dist <= 350 && (pA.esCalleGenerica || pB.esCalleGenerica || (pA.esCondominio && pB.esCondominio))) {
                            sonMismoLugar = true;
                        }
                    }
                } else if (pA.num === null && pB.num === null) {
                    if (sim >= 0.85 && (dist <= 80 || dist === Infinity)) sonMismoLugar = true;
                    else if (dist <= 15) sonMismoLugar = true;
                } else {
                    if (sim >= 0.88 && dist <= 30) sonMismoLugar = true;
                    else if (dist <= 12) sonMismoLugar = true;
                }

                if (sonMismoLugar) union(i, j);
            }
        }

        const grupos = new Map();
        for (let i = 0; i < n; i++) {
            const root = find(i);
            const gId = `grp_${root}`;
            if (!grupos.has(gId)) grupos.set(gId, []);
            grupos.get(gId).push(listaItems[i].codigo);
        }
        return grupos;
    }

    function elegirMejorCoordenadaGrupo(codigos) {
        const candidatos = codigos
            .map(c => {
                const ex = mapaExcel.get(c);
                const coord = ex ? obtenerCoordActivaExcel(c, ex) : { lat: null, lon: null };
                return { codigo: c, ex, lat: coord.lat, lon: coord.lon, esCorregido: mapaAccionPin.get(c) === "corregido" };
            })
            .filter(x => x.ex && x.lat !== null && x.lon !== null);

        if (candidatos.length === 0) return { lat: null, lon: null, maestro: codigos[0] };
        if (candidatos.length === 1) return { lat: candidatos[0].lat, lon: candidatos[0].lon, maestro: candidatos[0].codigo };

        let mejor = candidatos[0];
        let mejorScore = -1;

        for (const cand of candidatos) {
            let vecinosCerca = 0;
            for (const otro of candidatos) {
                if (distanciaMetros(cand.lat, cand.lon, otro.lat, otro.lon) <= 45) {
                    vecinosCerca++;
                }
            }
            const bonusPrecision = (!cand.ex.esPinSospechoso || cand.esCorregido) ? 0.5 : 0;
            const score = vecinosCerca + bonusPrecision;
            if (score > mejorScore) {
                mejorScore = score;
                mejor = cand;
            }
        }
        return { lat: mejor.lat, lon: mejor.lon, maestro: mejor.codigo };
    }

    // ---------------- EXPORTAR EXCEL LIMPIO PARA ROUTIN ----------------
    function limpiarDireccionParaRoutin(address, bairro, city, zip) {
        let dir = String(address || "").replace(/(\d)\.(\d)/g, "$1$2").trim();
        dir = dir.replace(/^R\.?\s+/i, "Rua ").replace(/^Av\.?\s+/i, "Avenida ");

        const partesComa = dir.split(",");
        if (partesComa.length >= 2) {
            const calleLimpia = partesComa[0]
                .replace(/\s+bairro\s+[a-z0-9\s]+$/i, "")
                .split("-")[0]
                .trim();
            const seg2 = partesComa[1].trim();
            if (/^s\s*\/?\s*n\b/i.test(seg2)) {
                dir = calleLimpia;
            } else {
                const mNum = seg2.match(/\d+/);
                dir = mNum ? `${calleLimpia}, ${mNum[0]}` : calleLimpia;
            }
        }

        const extras = [bairro, city, zip].filter(Boolean).join(", ");
        return extras ? `${dir}, ${extras}` : dir;
    }

    async function buscarCoordenadaFaltanteOSM(ex) {
        const queryDir = limpiarDireccionParaRoutin(ex.address, "", ex.city || "Santa Bárbara D'Oeste", "");
        // Sin headers personalizados para evitar CORS preflight
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&accept-language=pt-BR&q=${encodeURIComponent(queryDir)}`;
        try {
            const res = await fetch(url);
            if (!res.ok) return null;
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);
                if (Number.isFinite(lat) && Number.isFinite(lon)) return { lat, lon };
            }
        } catch (e) {}
        return null;
    }

    async function descargarExcelLimpio() {
        if (mapaExcel.size === 0 || typeof XLSX === "undefined") return;

        const btn = document.getElementById("btnExportarLimpio");
        const estadoEl = document.getElementById("estadoCarga");
        const metodo = document.querySelector('input[name="metodoExport"]:checked')?.value || "clasico";

        btn.disabled = true;
        const textoOriginalBtn = btn.innerText;

        try {
            const itemsExcel = Array.from(mapaExcel.entries()).map(([codigo, ex]) => {
                const coord = obtenerCoordActivaExcel(codigo, ex);
                return { codigo, texto: ex.address, zip: ex.zip, lat: coord.lat, lon: coord.lon };
            });
            const grupos = construirGruposSentidoComun(itemsExcel);

            const filasLimpias = [];
            let cantCorregidos = 0, cantSinGps = 0;

            for (const codigos of grupos.values()) {
                const { lat: bestLat, lon: bestLon, maestro } = elegirMejorCoordenadaGrupo(codigos);
                const totalGrupo = codigos.length;
                const tagMulti = totalGrupo > 1 ? `[📦x${totalGrupo}] ` : "";

                if (metodo === "agrupado") {
                    const ex = mapaExcel.get(maestro);
                    const omitirGps = codigos.some(c => mapaAccionPin.get(c) === "singps");
                    const usaCorregido = codigos.some(c => mapaAccionPin.get(c) === "corregido");
                    const esSospechoso = (bestLat === null || ex.esPinSospechoso) && !usaCorregido;
                    const tagPin = esSospechoso ? "[⚠️PIN?] " : "";
                    const dirLimpia = limpiarDireccionParaRoutin(ex.address, ex.bairro, ex.city, ex.zip);

                    if (usaCorregido && bestLat !== null) cantCorregidos++;
                    if (omitirGps || bestLat === null) cantSinGps++;

                    filasLimpias.push({
                        "Nombre": `${tagMulti}${tagPin}${ex.address}`,
                        "Direccion": dirLimpia,
                        "Bairro": ex.bairro,
                        "Cidade": ex.city,
                        "CEP": ex.zip,
                        "SPX_TN": maestro,
                        "Latitude": (!omitirGps && bestLat !== null) ? bestLat : "",
                        "Longitude": (!omitirGps && bestLon !== null) ? bestLon : ""
                    });
                } else {
                    for (const tn of codigos) {
                        const ex = mapaExcel.get(tn);
                        const accion = mapaAccionPin.get(tn) || "original";
                        const coord = obtenerCoordActivaExcel(tn, ex);
                        const latFinal = accion === "singps" ? null : (accion === "corregido" ? coord.lat : bestLat);
                        const lonFinal = accion === "singps" ? null : (accion === "corregido" ? coord.lon : bestLon);

                        const tieneSeq = ex.seq && ex.seq !== "-" && ex.stop && ex.stop !== "-";
                        const prefijoSeq = tieneSeq ? `${ex.seq} / ${ex.stop} / ` : "";
                        const esSospechoso = (latFinal === null || ex.esPinSospechoso) && accion !== "corregido";
                        const tagPin = esSospechoso ? "[⚠️PIN?] " : "";
                        const dirLimpia = limpiarDireccionParaRoutin(ex.address, ex.bairro, ex.city, ex.zip);

                        if (accion === "corregido" && latFinal !== null) cantCorregidos++;
                        if (latFinal === null) cantSinGps++;

                        filasLimpias.push({
                            "Nombre": `${tagMulti}${tagPin}${prefijoSeq}${ex.address}`,
                            "Direccion": dirLimpia,
                            "Bairro": ex.bairro,
                            "Cidade": ex.city,
                            "CEP": ex.zip,
                            "SPX_TN": tn,
                            "Latitude": latFinal !== null ? latFinal : "",
                            "Longitude": lonFinal !== null ? lonFinal : ""
                        });
                    }
                }
            }

            const ws = XLSX.utils.json_to_sheet(filasLimpias);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Routin_Limpio");

            const wbOut = XLSX.write(wb, { bookType: "xlsx", type: "array" });
            const blob = new Blob([wbOut], {
                type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const hoy = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `Routin_${metodo === "agrupado" ? "Agrupado" : "Limpio"}_${hoy}.xlsx`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1500);

            let msgExtra = `✅ Exportadas ${filasLimpias.length} filas (${metodo}).`;
            if (cantCorregidos > 0) msgExtra += ` ✅ ${cantCorregidos} pin(es) corregido(s).`;
            if (cantSinGps > 0) msgExtra += ` 📍 ${cantSinGps} sin GPS para Routin.`;
            estadoEl.innerText = msgExtra;
            estadoEl.style.color = "#4ade80";
        } finally {
            btn.disabled = false;
            btn.innerText = textoOriginalBtn;
        }
    }

    // ---------------- CARGA DE PDF ROUTIN ----------------
    async function cargarPDF(e) {
        const archivo = e.target.files[0];
        if (!archivo) return;

        const estadoEl = document.getElementById("estadoCarga");
        estadoEl.innerText = "Analizando páginas del PDF...";
        estadoEl.style.color = "#9ca3af";

        try {
            const arrayBuffer = await archivo.arrayBuffer();
            const pdfDocument = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const lineas = await extraerLineasPDF(pdfDocument);
            procesarLineasPDF(lineas);
        } catch (err) {
            console.error(err);
            estadoEl.innerText = "❌ Error al leer el PDF: " + err.message;
            estadoEl.style.color = "#f87171";
        } finally {
            e.target.value = "";
        }
    }

    async function extraerLineasPDF(pdfDocument) {
        const lineasTotales = [];
        for (let i = 1; i <= pdfDocument.numPages; i++) {
            const page = await pdfDocument.getPage(i);
            const textContent = await page.getTextContent();
            const filas = [];

            for (const item of textContent.items) {
                const texto = item.str.trim();
                if (!texto) continue;
                const x = item.transform[4];
                const y = item.transform[5];

                let fila = filas.find(f => Math.abs(f.y - y) <= 3);
                if (!fila) {
                    fila = { y, items: [] };
                    filas.push(fila);
                }
                fila.items.push({ x, texto });
            }

            filas.sort((a, b) => b.y - a.y);
            for (const fila of filas) {
                fila.items.sort((a, b) => a.x - b.x);
                lineasTotales.push(fila.items.map(it => it.texto).join(" "));
            }
        }
        return lineasTotales;
    }

    function procesarLineasPDF(lineas) {
        mapaPdfBase.clear();
        let bufferTexto = [];

        for (const linea of lineas) {
            if (/^(Ruta:|#\s+Nombre|Compartido a través)/i.test(linea)) continue;

            const matchBR = linea.match(/\b(BR[0-9A-Z]{13})\b/i);
            if (matchBR) {
                const codigoBR = matchBR[1].toUpperCase();
                const textoParada = bufferTexto.join(" ")
                    .replace(/(\s+-\s*)+$/g, "")
                    .trim();

                const matchNum = textoParada.match(/^(\d{1,3})\s+(.*)$/);
                const numParada = matchNum ? Number(matchNum[1]) : (mapaPdfBase.size + 1);
                let detalle = matchNum ? matchNum[2] : textoParada;

                const esAgrupado = /\[📦x\d+\]/.test(detalle);
                detalle = detalle.replace(/^(?:\[[^\]]+\]\s*)+/, "").trim();

                let refShopee = "";
                const matchRef = detalle.match(/^(\d{1,3}\s*\/\s*\d{1,3})\s*\/\s*(.*)$/);
                if (matchRef) {
                    refShopee = matchRef[1].replace(/\s+/g, "");
                    detalle = matchRef[2];
                }

                const dirPDF = detalle.replace(/\.{2,}\s*$/, "").trim();

                mapaPdfBase.set(codigoBR, {
                    parada: numParada,
                    refShopee,
                    dirPDF,
                    esAgrupado
                });

                bufferTexto = [];
            } else {
                bufferTexto.push(linea);
            }
        }

        reconstruirRutaActiva();
        guardarEstado();
        actualizarUIProgreso();
        actualizarEstadoCargaUI();
    }

    // ---------------- RECONCILIACIÓN PDF + EXCEL ----------------
    function reconstruirRutaActiva() {
        mapaRuta.clear();
        mapaGrupos.clear();
        omitidosEnPdf = [];

        if (mapaPdfBase.size === 0) return;

        for (const [codigo, pdfInfo] of mapaPdfBase.entries()) {
            const ex = mapaExcel.get(codigo);
            const coord = ex ? obtenerCoordActivaExcel(codigo, ex) : { lat: null, lon: null };
            const esCorr = mapaAccionPin.get(codigo) === "corregido";

            mapaRuta.set(codigo, {
                parada: pdfInfo.parada,
                refShopee: pdfInfo.refShopee,
                dirPDF: pdfInfo.dirPDF,
                dirCompleta: ex ? (ex.address || pdfInfo.dirPDF) : pdfInfo.dirPDF,
                bairro: ex ? (ex.bairro || "") : "",
                lat: coord.lat,
                lon: coord.lon,
                zip: ex ? (ex.zip || "") : "",
                esPinSospechoso: ex ? (ex.esPinSospechoso && !esCorr) : false,
                motivoSospecha: ex ? (ex.motivoOnline || ex.motivoSospecha || "") : "",
                grupoId: ""
            });
        }

        if (mapaExcel.size > 0) {
            const itemsExcel = Array.from(mapaExcel.entries()).map(([codigo, ex]) => {
                const coord = obtenerCoordActivaExcel(codigo, ex);
                return { codigo, texto: ex.address, zip: ex.zip, lat: coord.lat, lon: coord.lon };
            });
            const gruposExcel = construirGruposSentidoComun(itemsExcel);

            for (const codigosGrupo of gruposExcel.values()) {
                let codigoEnPdf = codigosGrupo.find(c => mapaPdfBase.has(c));
                if (codigoEnPdf) {
                    const paradaHeredada = mapaPdfBase.get(codigoEnPdf).parada;
                    for (const cod of codigosGrupo) {
                        if (!mapaRuta.has(cod)) {
                            const ex = mapaExcel.get(cod);
                            const coord = obtenerCoordActivaExcel(cod, ex);
                            const esCorr = mapaAccionPin.get(cod) === "corregido";
                            mapaRuta.set(cod, {
                                parada: paradaHeredada,
                                refShopee: (ex.seq && ex.seq !== "-") ? `${ex.seq}/${ex.stop}` : "",
                                dirPDF: ex.address,
                                dirCompleta: ex.address,
                                bairro: ex.bairro || "",
                                lat: coord.lat,
                                lon: coord.lon,
                                zip: ex.zip || "",
                                esPinSospechoso: ex.esPinSospechoso && !esCorr,
                                motivoSospecha: ex.motivoOnline || ex.motivoSospecha || "",
                                grupoId: ""
                            });
                        }
                    }
                }
            }

            for (const [cod, ex] of mapaExcel.entries()) {
                if (!mapaRuta.has(cod)) {
                    omitidosEnPdf.push({ codigo: cod, address: ex.address });
                }
            }
        }

        const itemsRuta = Array.from(mapaRuta.entries()).map(([codigo, d]) => ({
            codigo,
            texto: d.dirCompleta,
            zip: d.zip || "",
            lat: d.lat,
            lon: d.lon
        }));
        const gruposFinales = construirGruposSentidoComun(itemsRuta);

        for (const [gId, codigos] of gruposFinales.entries()) {
            const paradas = [];
            for (const cod of codigos) {
                const d = mapaRuta.get(cod);
                d.grupoId = gId;
                paradas.push(d.parada);
            }
            paradas.sort((a, b) => a - b);
            mapaGrupos.set(gId, { count: codigos.length, paradas, codigos });
        }
    }

    // ---------------- COMPLEMENTOS Y ALERTAS ----------------
    function extraerBlocoApto(texto) {
        const mBl = texto.match(/(?:^|[^a-z])(?:bloco|blo|bl\.?)\s*([0-9]+|[a-z](?=\b|\s|\/|-|$))/i);
        const mAp = texto.match(/(?:^|[^a-z])(?:apartamento|aparta|apto\.?|apt\.?|ap\.?)\s*([0-9A-Za-z]+)/i);
        const partes = [];
        if (mBl) partes.push(`Bloco ${mBl[1].toUpperCase()}`);
        if (mAp) partes.push(`Apto ${mAp[1].toUpperCase()}`);
        return partes.join(" / ");
    }

    function detectarAlertas(texto) {
        const alertas = [];
        const t = texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        if (/\b(comercio|comercial|horario|loja|padaria|salao|lanchonete|escola|mercado|seg a sex|segunda|empresa|deposito|oficina|imobiliaria)\b/.test(t)) {
            alertas.push({ texto: "🏢 COMERCIO / HORARIO", tipo: "" });
        }
        if (/\b(condominio|cond\.|conde\.|bloco|bl\s*\d|apto|apartamento|portaria)\b/.test(t)) {
            alertas.push({ texto: "🏘️ CONDOMINIO", tipo: "" });
        }
        if (/\b(nao jogar|quintal|portao|fundo|frente|placa|entregar|vizinho|cachorro|cao|garagem|jogar)\b/.test(t)) {
            alertas.push({ texto: "⚠️ LEER NOTA", tipo: "nota" });
        }
        return alertas;
    }

    // ---------------- PERSISTENCIA ----------------
    function guardarEstado() {
        try {
            localStorage.setItem(STORAGE_PDF, JSON.stringify(Array.from(mapaPdfBase.entries())));
            localStorage.setItem(STORAGE_EXCEL, JSON.stringify(Array.from(mapaExcel.entries())));
            localStorage.setItem(STORAGE_SCAN, JSON.stringify(Array.from(setEscaneados)));
            localStorage.setItem(STORAGE_ATRAS, JSON.stringify(Array.from(setAtras)));
            localStorage.setItem(STORAGE_ACCION_PIN, JSON.stringify(Array.from(mapaAccionPin.entries())));
        } catch (e) {
            console.warn("No se pudo guardar en localStorage:", e);
        }
    }

    function restaurarEstado() {
        try {
            const rawPdf = localStorage.getItem(STORAGE_PDF);
            if (rawPdf) mapaPdfBase = new Map(JSON.parse(rawPdf));

            const rawEx = localStorage.getItem(STORAGE_EXCEL);
            if (rawEx) {
                mapaExcel = new Map(JSON.parse(rawEx));
                analizarPinesSospechososOffline();
            }

            const rawScan = localStorage.getItem(STORAGE_SCAN);
            if (rawScan) setEscaneados = new Set(JSON.parse(rawScan));

            const rawAtras = localStorage.getItem(STORAGE_ATRAS);
            if (rawAtras) setAtras = new Set(JSON.parse(rawAtras));

            const rawAcc = localStorage.getItem(STORAGE_ACCION_PIN);
            if (rawAcc) mapaAccionPin = new Map(JSON.parse(rawAcc));

            reconstruirRutaActiva();
            actualizarUIProgreso();
            actualizarEstadoCargaUI(true);
            actualizarContadorAtrasBtn();
        } catch (e) {
            console.warn("Error restaurando estado:", e);
        }
    }

    function actualizarUIProgreso() {
