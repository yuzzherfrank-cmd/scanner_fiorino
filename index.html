<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Escáner Pro - Carga Fiorino</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #101216;
            --card: #1b1f27;
            --card-2: #252b36;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --green: #15803d;
            --amber: #b45309;
            --red: #b91c1c;
            --blue: #2563eb;
            --border: #303746;
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px 12px 40px;
            -webkit-tap-highlight-color: transparent;
        }

        .container { max-width: 460px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header h1 { font-size: 1.15rem; margin: 0; font-weight: 700; }
        .header-actions { display: flex; gap: 6px; }

        .btn-icon {
            background: var(--card-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-icon.activo { background: #eab308; color: #000; border-color: #eab308; }
        .btn-icon.peligro { color: #fca5a5; }
        .btn-exportar {
            width: 100%;
            margin-top: 8px;
            background: #1d4ed8;
            border-color: #3b82f6;
            color: #fff;
            padding: 10px;
        }

        .progreso-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .progreso-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .barra-bg {
            width: 100%;
            height: 10px;
            background: #2d3340;
            border-radius: 999px;
            overflow: hidden;
        }
        .barra-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            transition: width 0.25s ease;
        }

        .scanner-wrap {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }
        #reader { width: 100%; min-height: 220px; }
        .scanner-controls {
            display: flex;
            gap: 8px;
            padding: 8px;
            background: var(--card);
            border-top: 1px solid var(--border);
        }
        .scanner-controls button { flex: 1; }

        /* Tarjeta de Resultado */
        #resultado {
            border-radius: 12px;
            padding: 16px 14px;
            margin-bottom: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            text-align: center;
            transition: background 0.15s ease;
        }
        #resultado.verde { background: var(--green); border-color: #22c55e; }
        #resultado.ambar { background: var(--amber); border-color: #f59e0b; }
        #resultado.rojo { background: var(--red); border-color: #ef4444; }

        .res-top {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .parada-num { font-size: 2.05rem; font-weight: 900; letter-spacing: -0.5px; line-height: 1.1; }
        .zona-badge {
            font-size: 0.85rem;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
        }
        .estado-tag {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.28);
        }
        .alertas-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }
        .alerta-pill {
            font-size: 0.74rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            background: #fef08a;
            color: #422006;
        }
        .alerta-pill.nota { background: #fed7aa; color: #431407; }

        .info-bultos {
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.28);
            font-size: 0.98rem;
            font-weight: 700;
            color: #fef08a;
        }
        .bultos-paradas {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-top: 6px;
        }
        .chip-parada {
            font-size: 0.78rem;
            padding: 2px 7px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
        }
        .chip-parada.ok {
            background: #22c55e;
            color: #052e16;
            font-weight: 800;
        }
        .info-direccion {
            margin-top: 10px;
            font-size: 0.96rem;
            line-height: 1.35;
            font-weight: 600;
            color: #fff;
        }
        .info-bairro {
            margin-top: 3px;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.85);
        }
        .info-guia {
            margin-top: 6px;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.78);
            font-family: monospace;
        }

        .quick-actions {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }
        .btn-mini {
            background: rgba(0, 0, 0, 0.32);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 6px;
            padding: 5px 9px;
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-mini.copiado { background: #fef08a; color: #000; border-color: #fef08a; }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .panel label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--muted);
        }
        .file-group { margin-bottom: 10px; }
        .file-group:last-of-type { margin-bottom: 0; }

        input[type="text"], input[type="file"] {
            width: 100%;
            background: var(--card-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 10px;
            font-size: 0.92rem;
        }
        .busqueda-resultados {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .busqueda-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: var(--card-2);
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.84rem;
        }
        .busqueda-item button {
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 7px 10px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }
        .estado-carga {
            margin-top: 8px;
            font-size: 0.83rem;
            color: var(--muted);
            line-height: 1.35;
        }

        /* Modal */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            z-index: 100;
            padding: 12px;
            overflow-y: auto;
        }
        .modal-backdrop.abierto { display: block; }
        .modal-box {
            max-width: 460px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
        .tab-btn {
            flex: 1;
            background: var(--card-2);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 4px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }
        .tab-btn.activa { background: var(--blue); color: #fff; border-color: var(--blue); }
        .lista-items {
            max-height: 62vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 10px;
        }
        .lista-row {
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 10px;
            font-size: 0.84rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .lista-row small { color: var(--muted); display: block; margin-top: 2px; font-family: monospace; }

        /* Acordeón Multibulto */
        details.multi-grupo {
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 9px;
            overflow: hidden;
        }
        summary.multi-summary {
            list-style: none;
            cursor: pointer;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            user-select: none;
        }
        summary.multi-summary::-webkit-details-marker { display: none; }
        .multi-titulo { line-height: 1.3; }
        .multi-titulo small { display: block; color: var(--muted); font-size: 0.76rem; margin-top: 2px; }
        .multi-badge {
            background: #374151;
            color: #fef08a;
            font-weight: 800;
            font-size: 0.78rem;
            padding: 4px 8px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .multi-badge.completo { background: #16a34a; color: #052e16; }
        .multi-body {
            border-top: 1px solid var(--border);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: #171b22;
        }
        .multi-subrow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border-radius: 6px;
            background: var(--card-2);
            font-size: 0.81rem;
        }
        .multi-subrow small { color: var(--muted); display: block; font-family: monospace; margin-top: 2px; }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>Escáner Fiorino Pro</h1>
        <div class="header-actions">
            <button id="btnSonido" class="btn-icon activo" onclick="toggleSonido()">🗣️ Voz</button>
            <button class="btn-icon" onclick="abrirModal()">📋 Lista</button>
        </div>
    </div>

    <div class="progreso-box">
        <div class="progreso-top">
            <span id="txtProgreso">Cargados: 0 / 0</span>
            <span id="txtPorcentaje">0%</span>
        </div>
        <div class="barra-bg">
            <div id="barraFill" class="barra-fill"></div>
        </div>
    </div>

    <div class="scanner-wrap">
        <div id="reader"></div>
        <div class="scanner-controls">
            <button id="btnLinterna" class="btn-icon" onclick="toggleLinterna()">🔦 Linterna</button>
            <button id="btnPausa" class="btn-icon" onclick="togglePausaCamara()">⏸️ Pausar</button>
        </div>
    </div>

    <div id="resultado">
        <div style="font-size:1.1rem; font-weight:700;">Esperando escaneo...</div>
        <div class="info-guia">Apunta a cualquiera de los 3 QR o al código de barras</div>
    </div>

    <div class="panel">
        <label for="busquedaManual">Búsqueda rápida (últimos dígitos, calle o bloque):</label>
        <input type="text" id="busquedaManual" placeholder="Ej: 51188X, Rubi o 221" oninput="buscarManual(this.value)">
        <div id="busquedaResultados" class="busqueda-resultados"></div>
    </div>

    <div class="panel">
        <div class="file-group">
            <label for="subirPdf">1. PDF de Routin (Orden de paradas):</label>
            <input type="file" id="subirPdf" accept="application/pdf" onchange="cargarPDF(event)">
        </div>
        <div class="file-group">
            <label for="subirExcel">2. Excel de Shopee .xlsx / .csv (GPS, notas y limpieza para Routin):</label>
            <input type="file" id="subirExcel" accept=".xlsx,.xls,.csv" onchange="cargarExcel(event)">
            <button id="btnExportarRoutin" class="btn-icon btn-exportar" style="display:none;" onclick="exportarExcelParaRoutin()">
                🧹 Descargar Excel limpio para Routin
            </button>
            <div id="resumenLimpieza" class="estado-carga" style="color:#93c5fd; display:none;"></div>
        </div>
        <div id="estadoCarga" class="estado-carga">Esperando archivos...</div>
        <div style="margin-top:8px; display:flex; justify-content:flex-end;">
            <button class="btn-icon peligro" onclick="limpiarRuta()">🗑️ Limpiar ruta guardada</button>
        </div>
    </div>

</div>

<!-- Modal Lista de Control -->
<div id="modalLista" class="modal-backdrop" onclick="if(event.target === this) cerrarModal()">
    <div class="modal-box">
        <div class="modal-header">
            <strong style="font-size:1rem;">Control de Ruta</strong>
            <button class="btn-icon" onclick="cerrarModal()">✖ Cerrar</button>
        </div>
        <div class="tabs">
            <button class="tab-btn activa" id="tabFaltantes" onclick="cambiarTab('faltantes')">Faltantes</button>
            <button class="tab-btn" id="tabCargados" onclick="cambiarTab('cargados')">Cargados</button>
            <button class="tab-btn" id="tabMulti" onclick="cambiarTab('multi')">Multibulto</button>
        </div>
        <input type="text" id="filtroModal" placeholder="Filtrar por parada, calle, bloque o BR..." oninput="renderizarListaModal()">
        <div id="listaModalContenido" class="lista-items"></div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const STORAGE_RUTA = "escaner_fiorino_ruta_v2";
    const STORAGE_EXCEL = "escaner_fiorino_excel_v2";
    const STORAGE_EXCEL_RAW = "escaner_fiorino_excel_raw_v1";
    const STORAGE_AUDIO = "escaner_audio_modo";

    let html5QrCode = null;
    let isScannerRunning = false;
    let scannerPausadoManual = false;
    let scannerBusy = false;
    let linternaActiva = false;

    let modoAudio = localStorage.getItem(STORAGE_AUDIO) || "voz";
    let audioCtx = null;

    let ultimoCodigoLeido = "";
    let ultimoTiempoLeido = 0;
    const COOLDOWN_MS = 2500;

    let mapaRuta = new Map();
    let mapaExcel = new Map();
    let excelFilasOriginales = [];
    let nombreArchivoExcel = "shopee_para_routin.xlsx";
    let mapaGrupos = new Map();

    let tabActual = "faltantes";
    let gruposAbiertos = new Set();

    // ---------------- AUDIO Y VOZ ----------------
    function desbloquearAudio() {
        if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume().catch(() => {});
        }
    }
    document.addEventListener("touchstart", desbloquearAudio, { passive: true });
    document.addEventListener("click", desbloquearAudio, { passive: true });

    function actualizarBtnSonido() {
        const btn = document.getElementById("btnSonido");
        if (!btn) return;
        if (modoAudio === "voz") {
            btn.innerText = "🗣️ Voz";
            btn.classList.add("activo");
        } else if (modoAudio === "beep") {
            btn.innerText = "🔔 Beep";
            btn.classList.add("activo");
        } else {
            btn.innerText = "🔇 Mudo";
            btn.classList.remove("activo");
        }
    }

    function toggleSonido() {
        if (modoAudio === "voz") modoAudio = "beep";
        else if (modoAudio === "beep") modoAudio = "mudo";
        else modoAudio = "voz";

        localStorage.setItem(STORAGE_AUDIO, modoAudio);
        actualizarBtnSonido();

        if (modoAudio !== "voz" && "speechSynthesis" in window) {
            window.speechSynthesis.cancel();
        }
        if (modoAudio === "voz") hablarTexto("Voz activa");
        else if (modoAudio === "beep") emitirBeep("ok");
    }

    function hablarTexto(texto) {
        if (modoAudio !== "voz" || !("speechSynthesis" in window)) return;
        try {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(texto);
            u.lang = "es-ES";
            u.rate = 1.15;
            u.pitch = 1.0;
            window.speechSynthesis.speak(u);
        } catch (e) {}
    }

    function emitirBeep(tipo, textoVoz = "") {
        if (modoAudio === "mudo") return;

        if (audioCtx) {
            if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
            const tocar = (freq, dur, delay = 0, wave = "sine") => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = wave;
                osc.frequency.value = freq;
                const start = audioCtx.currentTime + delay;
                gain.gain.setValueAtTime(0.28, start);
                gain.gain.exponentialRampToValueAtTime(0.01, start + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(start);
                osc.stop(start + dur);
            };

            if (tipo === "ok") tocar(920, 0.1);
            else if (tipo === "multi") { tocar(900, 0.08, 0); tocar(1240, 0.12, 0.11); }
            else if (tipo === "duplicado") { tocar(520, 0.09, 0, "triangle"); tocar(420, 0.1, 0.11, "triangle"); }
            else if (tipo === "error") tocar(210, 0.3, 0, "sawtooth");
        }

        if (modoAudio === "voz" && textoVoz) {
            setTimeout(() => hablarTexto(textoVoz), 160);
        }
    }

    // ---------------- UTILIDADES ----------------
    function esc(str) {
        return String(str || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function sinAcentos(str) {
        return String(str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function coordsValidas(lat, lon) {
        return Number.isFinite(lat) && Number.isFinite(lon) && !(Math.abs(lat) < 0.01 && Math.abs(lon) < 0.01);
    }

    function obtenerZonaFiorino(parada, total) {
        if (total < 4) return { texto: `PARADA #${parada}`, color: "rgba(0,0,0,0.35)" };
        const pct = parada / total;
        if (pct > 0.75) return { texto: "⬆️ FONDO", color: "#4c1d95" };
        if (pct > 0.50) return { texto: "◀️ MEDIO ATRÁS", color: "#1e40af" };
        if (pct > 0.25) return { texto: "▶️ MEDIO ADELANTE", color: "#0f766e" };
        return { texto: "⬇️ PUERTA", color: "#166534" };
    }

    // ---------------- CARGA DE EXCEL SHOPEE (.XLSX / .CSV) ----------------
    async function cargarExcel(e) {
        const archivo = e.target.files[0];
        if (!archivo) return;

        const estadoEl = document.getElementById("estadoCarga");
        estadoEl.innerText = "Leyendo planilla de Shopee...";
        estadoEl.style.color = "#9ca3af";

        try {
            if (typeof XLSX === "undefined") {
                throw new Error("Librería Excel aún no cargada (revisa tu conexión la primera vez).");
            }
            const data = await archivo.arrayBuffer();
            const workbook = XLSX.read(data, { type: "array" });
            const sheetName = workbook.SheetNames[0];
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });

            mapaExcel.clear();
            excelFilasOriginales = rows;
            const baseName = archivo.name.replace(/\.(xlsx|xls|csv)$/i, "");
            nombreArchivoExcel = `${baseName}_LIMPIO_ROUTIN.xlsx`;

            for (const row of rows) {
                let tn = String(row["SPX TN"] || row["SPX_TN"] || row["TN"] || "").trim().toUpperCase();
                if (!tn) {
                    for (const val of Object.values(row)) {
                        const m = String(val).match(/\b(BR[0-9A-Z]{13})\b/i);
                        if (m) { tn = m[1].toUpperCase(); break; }
                    }
                }
                if (!tn) continue;

                const address = String(row["Destination Address"] || row["Address"] || row["Endereço"] || "").trim();
                const bairro = String(row["Bairro"] || row["Neighborhood"] || "").trim();
                const latRaw = String(row["Latitude"] || row["Lat"] || "").replace(",", ".").trim();
                const lonRaw = String(row["Longitude"] || row["Lon"] || row["Lng"] || "").replace(",", ".").trim();

                const lat = parseFloat(latRaw);
                const lon = parseFloat(lonRaw);
                const gpsOk = coordsValidas(lat, lon);

                mapaExcel.set(tn, {
                    address,
                    bairro,
                    lat: gpsOk ? lat : null,
                    lon: gpsOk ? lon : null
                });
            }

            if (mapaRuta.size > 0) {
                enriquecerYAgrupar();
            }
            guardarEstado();
            actualizarEstadoCargaUI();
            document.getElementById("resumenLimpieza").style.display = "none";
        } catch (err) {
            console.error(err);
            estadoEl.innerText = "Error al leer Excel: " + err.message;
            estadoEl.style.color = "#f87171";
        } finally {
            e.target.value = "";
        }
    }

    // ---------------- LIMPIADOR + COMPLETADOR LÓGICO PARA ROUTIN ----------------
    const REGEX_PREFIJO = /^(rua|r\.|r|avenida|av\.|av|travessa|tv\.|tv|alameda|al\.|al|rodovia|rod\.|estrada|est\.|pra[çc]a|p[çc]a\.|largo|viela|beco)\s+/i;

    function expandirPrefijo(calle) {
        return calle
            .replace(/^r\.?\s+/i, "Rua ")
            .replace(/^av\.?\s+/i, "Avenida ")
            .replace(/^tv\.?\s+/i, "Travessa ")
            .replace(/^al\.?\s+/i, "Alameda ")
            .replace(/^p[çc]a\.?\s+/i, "Praça ")
            .replace(/^est\.?\s+/i, "Estrada ")
            .replace(/\s+/g, " ")
            .trim();
    }

    function limpiarCallePreComa(calleRaw, bairroNorm) {
        let calle = calleRaw
            .replace(/\([^)]*\)/g, " ") // Quita "(horário comercial)" dentro de la calle
            .replace(/\s+/g, " ")
            .trim();

        // Quita ": Residencial Dom Pietro" pegado con ":"
        if (calle.includes(":")) {
            calle = calle.split(":")[0].trim();
        }

        calle = expandirPrefijo(calle);

        // Quitar "-Bairro" pegado al nombre sin romper guiones reales (ej: "Mac-Knight" o "Mogi-Mirim")
        if (calle.includes("-")) {
            const idx = calle.lastIndexOf("-");
            const izq = calle.slice(0, idx).trim();
            const der = calle.slice(idx + 1).trim();
            const derNorm = sinAcentos(der).toLowerCase();
            if (derNorm.length >= 4 && (
                (bairroNorm && (bairroNorm.includes(derNorm) || derNorm.includes(bairroNorm))) ||
                /\b(joias|jardim|parque|vila|residencial|condominio)\b/.test(derNorm)
            )) {
                calle = izq;
            }
        }
        return calle.trim();
    }

    function limpiarDireccionIndividual(dirRaw, bairroRaw, cityRaw) {
        let dir = String(dirRaw || "").replace(/(\d)\.(\d)/g, "$1$2").replace(/\s+/g, " ").trim();
        const bairroNorm = sinAcentos(bairroRaw).toLowerCase().trim();
        const cityNorm = sinAcentos(cityRaw).toLowerCase().trim();

        // 1) Formato normal con coma: "Calle, 123..." o "Calle, 201 B, ..."
        let match = dir.match(/^([^,]+),\s*(\d+(?:\s*[A-Za-z](?=\s*(?:,|$)))?)(?:,(.*))?$/);
        // 2) Fallback sin coma antes del número: "R Noruega 1260, SP"
        if (!match) {
            match = dir.match(/^(.+?)\s+(\d+(?:\s*[A-Za-z](?=\s*(?:,|$)))?)(?:,\s*(.*))?$/);
        }

        if (!match) {
            const c = limpiarCallePreComa(dir, bairroNorm);
            return { calleLimpia: c, tienePrefijo: REGEX_PREFIJO.test(c), num: null, numBase: null, restoLimpio: [] };
        }

        const calle = limpiarCallePreComa(match[1], bairroNorm);
        const num = match[2].replace(/\s+/g, " ").trim();
        const numBase = (num.match(/\d+/) || [num])[0];
        const restoRaw = match[3] ? match[3].split(",").map(s => s.trim()).filter(Boolean) : [];

        const regexRiesgoPOI = /\b(proximo|proxima|paralela|perto|esquina|ao lado|do lado|sentido|passando|em frente|enfrente|nao jogar|jogar|garagem|quintal|bater|chamar|horario|seg a sex|supermercado|escola|farmacia|padaria|lanchonete|bela horta|pico modas|casa de maria|pavan|cemiterio|vidracaria|trailer|toldo|borracha|toop som|raul livros|azulejo|barbearia|esmalteria|grafica|buffet|emporio|empresa|trabalho|drogal|loterica|contabilidade|agropet|mercearia)\b/i;

        const restoLimpio = [];
        for (const parte of restoRaw) {
            // Comprime letras repetidas ("JOGARRRRR" -> "jogar") solo para evaluar riesgo
            const pNorm = sinAcentos(parte).toLowerCase().replace(/([a-z])\1{2,}/g, "$1").trim();
            if (!pNorm || pNorm === "n/a" || pNorm === "brasil") continue;
            if (/^(sao paulo|sp)$/i.test(pNorm)) continue;
            if (/^\d{5}-?\d{3}$/.test(pNorm)) continue;
            if (cityNorm && pNorm === cityNorm) continue;
            if (bairroNorm && pNorm === bairroNorm) continue;
            if (regexRiesgoPOI.test(pNorm)) continue;
            restoLimpio.push(parte);
        }

        return {
            calleLimpia: calle,
            tienePrefijo: REGEX_PREFIJO.test(calle),
            num,
            numBase,
            restoLimpio
        };
    }

    function exportarExcelParaRoutin() {
        if (!excelFilasOriginales || excelFilasOriginales.length === 0) return;

        let contLimpiadas = 0;
        let contPrefijos = 0;
        let contConsensoGPS = 0;
        const ejemplosCambio = [];

        const registros = excelFilasOriginales.map((row) => {
            const copia = { ...row };
            const colAddr = copia["Destination Address"] !== undefined ? "Destination Address" : (copia["Address"] !== undefined ? "Address" : "Destination Address");
            const origAddr = String(copia[colAddr] || "").trim();
            const bairro = String(copia["Bairro"] || copia["Neighborhood"] || "").trim();
            const city = String(copia["City"] || "").trim();
            const lat = parseFloat(String(copia["Latitude"] || "").replace(",", "."));
            const lon = parseFloat(String(copia["Longitude"] || "").replace(",", "."));
            const gpsOk = coordsValidas(lat, lon);

            const info = limpiarDireccionIndividual(origAddr, bairro, city);
            const sinPref = info.calleLimpia.replace(REGEX_PREFIJO, "").trim();
            const prefMatch = info.calleLimpia.match(REGEX_PREFIJO);

            return {
                copia,
                colAddr,
                origAddr,
                info,
                prefijo: prefMatch ? prefMatch[0].trim() : "",
                calleSinPrefNorm: sinAcentos(sinPref).toLowerCase().replace(/-/g, " ").replace(/\s+/g, " ").trim(),
                lat: gpsOk ? lat : null,
                lon: gpsOk ? lon : null
            };
        });

        // Paso 2A: Completar prefijos faltantes ("Humberto De Lucca" -> "Rua Humberto De Lucca")
        const mapaPrefijos = new Map();
        for (const r of registros) {
            if (r.prefijo && r.calleSinPrefNorm && !mapaPrefijos.has(r.calleSinPrefNorm)) {
                mapaPrefijos.set(r.calleSinPrefNorm, r.prefijo);
            }
        }
        for (const r of registros) {
            if (!r.info.tienePrefijo && r.info.numBase && mapaPrefijos.has(r.calleSinPrefNorm)) {
                const pref = mapaPrefijos.get(r.calleSinPrefNorm);
                r.info.calleLimpia = `${pref.charAt(0).toUpperCase() + pref.slice(1).toLowerCase()} ${r.info.calleLimpia}`;
                r.info.tienePrefijo = true;
                contPrefijos++;
            }
        }

        // Paso 2B: Consenso por GPS (<= 40m) o similitud fuerte de calle + mismo número base
        const n = registros.length;
        const padre = Array.from({ length: n }, (_, i) => i);
        const find = (x) => (padre[x] === x ? x : (padre[x] = find(padre[x])));
        const union = (a, b) => {
            const ra = find(a), rb = find(b);
            if (ra !== rb) padre[rb] = ra;
        };

        for (let i = 0; i < n; i++) {
            for (let j = i + 1; j < n; j++) {
                const A = registros[i], B = registros[j];
                if (!A.info.numBase || A.info.numBase !== B.info.numBase) continue;
                const dist = distanciaMetros(A.lat, A.lon, B.lat, B.lon);
                const sim = similitudBigrams(A.calleSinPrefNorm, B.calleSinPrefNorm);
                if (dist <= 40 || sim >= 0.85) union(i, j);
            }
        }

        const clusters = new Map();
        for (let i = 0; i < n; i++) {
            const root = find(i);
            if (!clusters.has(root)) clusters.set(root, []);
            clusters.get(root).push(registros[i]);
        }

        for (const grupo of clusters.values()) {
            if (grupo.length < 2) continue;
            const conteo = new Map();
            for (const r of grupo) {
                const key = sinAcentos(r.info.calleLimpia).toLowerCase().replace(/-/g, " ").replace(/\s+/g, " ").trim();
                if (!conteo.has(key)) conteo.set(key, { count: 0, mejorTexto: r.info.calleLimpia });
                const entry = conteo.get(key);
                entry.count += 1;
                // Preferir versión limpia sin "-" ni typo "schimidt" ni texto largo de condominio pegado
                if (!/schimidt/i.test(r.info.calleLimpia) && r.info.calleLimpia.length <= entry.mejorTexto.length + 12) {
                    if (r.info.calleLimpia.length < entry.mejorTexto.length && /bloco|cond|treviso|nature/i.test(entry.mejorTexto)) {
                        entry.mejorTexto = r.info.calleLimpia;
                    }
                }
            }
            if (conteo.size <= 1) continue;

            let ganadora = null;
            for (const [key, data] of conteo.entries()) {
                if (!ganadora || data.count > ganadora.count ||
                    (data.count === ganadora.count && data.mejorTexto.length < ganadora.mejorTexto.length && !/\bum\b/i.test(data.mejorTexto))) {
                    ganadora = { key, ...data };
                }
            }

            for (const r of grupo) {
                const key = sinAcentos(r.info.calleLimpia).toLowerCase().replace(/-/g, " ").replace(/\s+/g, " ").trim();
                if (key !== ganadora.key && (ganadora.count >= 2 || /schimidt|bloco|cond/i.test(r.info.calleLimpia))) {
                    const antes = r.info.calleLimpia;
                    r.info.calleLimpia = ganadora.mejorTexto.replace(/schimidt/gi, "Schmidt");
                    contConsensoGPS++;
                    if (ejemplosCambio.length < 3) {
                        ejemplosCambio.push(`"${antes}, ${r.info.num}" → "${r.info.calleLimpia}, ${r.info.num}"`);
                    }
                }
            }
        }

        const filasSalida = registros.map((r) => {
            const nuevaDir = r.info.num
                ? (r.info.restoLimpio.length > 0
                    ? `${r.info.calleLimpia}, ${r.info.num}, ${r.info.restoLimpio.join(", ")}`
                    : `${r.info.calleLimpia}, ${r.info.num}`)
                : r.info.calleLimpia;

            if (nuevaDir !== r.origAddr) contLimpiadas++;
            r.copia[r.colAddr] = nuevaDir;

            if (r.copia["Zipcode/Postal code"] !== undefined) {
                const cep = String(r.copia["Zipcode/Postal code"]).replace(/\D/g, "");
                if (cep.length === 8) r.copia["Zipcode/Postal code"] = `${cep.slice(0, 5)}-${cep.slice(5)}`;
            }
            return r.copia;
        });

        const ws = XLSX.utils.json_to_sheet(filasSalida);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Route");
        XLSX.writeFile(wb, nombreArchivoExcel);

        const resEl = document.getElementById("resumenLimpieza");
        resEl.style.display = "block";
        resEl.innerHTML = `🧹 <strong>Archivo descargado:</strong> ${contLimpiadas} direcciones depuradas • ${contPrefijos} prefijos completados • ${contConsensoGPS} calles corregidas por consenso.` +
            (ejemplosCambio.length > 0 ? `<br><span style="color:#bfdbfe;">Ej: ${esc(ejemplosCambio.join(" | "))}</span>` : "");
    }

    // ---------------- CARGA DE PDF ROUTIN ----------------
    async function cargarPDF(e) {
        const archivo = e.target.files[0];
        if (!archivo) return;

        const estadoEl = document.getElementById("estadoCarga");
        estadoEl.innerText = "Analizando páginas del PDF...";
        estadoEl.style.color = "#9ca3af";

        try {
            const arrayBuffer = await archivo.arrayBuffer();
            const pdfDocument = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const lineas = await extraerLineasPDF(pdfDocument);
            procesarLineasRuta(lineas);
        } catch (err) {
            console.error(err);
            estadoEl.innerText = "Error al leer el PDF: " + err.message;
            estadoEl.style.color = "#f87171";
        } finally {
            e.target.value = "";
        }
    }

    async function extraerLineasPDF(pdfDocument) {
        const lineasTotales = [];
        for (let i = 1; i <= pdfDocument.numPages; i++) {
            const page = await pdfDocument.getPage(i);
            const textContent = await page.getTextContent();
            const filas = [];

            for (const item of textContent.items) {
                const texto = item.str.trim();
                if (!texto) continue;
                const x = item.transform[4];
                const y = item.transform[5];

                let fila = filas.find(f => Math.abs(f.y - y) <= 3);
                if (!fila) {
                    fila = { y, items: [] };
                    filas.push(fila);
                }
                fila.items.push({ x, texto });
            }

            filas.sort((a, b) => b.y - a.y);
            for (const fila of filas) {
                fila.items.sort((a, b) => a.x - b.x);
                lineasTotales.push(fila.items.map(it => it.texto).join(" "));
            }
        }
        return lineasTotales;
    }

    function procesarLineasRuta(lineas) {
        mapaRuta.clear();
        let bufferTexto = [];

        for (const linea of lineas) {
            if (/^(Ruta:|#\s+Nombre|Compartido a través)/i.test(linea)) continue;

            const matchBR = linea.match(/\b(BR[0-9A-Z]{13})\b/i);
            if (matchBR) {
                const codigoBR = matchBR[1].toUpperCase();
                const textoParada = bufferTexto.join(" ").replace(/(\s+-\s*)+$/g, "").trim();

                const matchNum = textoParada.match(/^(\d{1,3})\s+(.*)$/);
                const numParada = matchNum ? Number(matchNum[1]) : (mapaRuta.size + 1);
                let detalle = matchNum ? matchNum[2] : textoParada;

                let refShopee = "";
                const matchRef = detalle.match(/^(\d{1,3}\s*\/\s*\d{1,3})\s*\/\s*(.*)$/);
                if (matchRef) {
                    refShopee = matchRef[1].replace(/\s+/g, "");
                    detalle = matchRef[2];
                }

                const dirPDF = detalle.replace(/\.{2,}\s*$/, "").trim();

                mapaRuta.set(codigoBR, {
                    parada: numParada,
                    refShopee,
                    dirPDF,
                    dirCompleta: dirPDF,
                    bairro: "",
                    lat: null,
                    lon: null,
                    grupoId: "",
                    escaneado: false
                });

                bufferTexto = [];
            } else {
                bufferTexto.push(linea);
            }
        }

        enriquecerYAgrupar();
        guardarEstado();
        actualizarUIProgreso();
        actualizarEstadoCargaUI();
    }

    // ---------------- ALGORITMO "SENTIDO COMÚN" (TEXTO + GPS + NÚMERO) ----------------
    function parsearDireccionInteligente(texto) {
        let limpio = sinAcentos(String(texto || "").replace(/(\d)\.(\d)/g, "$1$2")).toLowerCase();
        limpio = limpio.replace(/\([^)]*\)/g, " ").replace(REGEX_PREFIJO, "").trim();

        let calle = "";
        let num = null;
        let m = limpio.match(/^([^,]+),\s*(\d+)\b/);
        if (!m) m = limpio.match(/^(.+?)\s+(\d+)(?:[A-Za-z]?)\s*(?:,|$)/);

        if (m) {
            calle = m[1];
            num = m[2];
        } else {
            calle = limpio.split(",")[0];
        }

        if (calle.includes(":")) calle = calle.split(":")[0];

        calle = calle
            .replace(/schimidt/g, "schmidt")
            .replace(/[^a-z0-9\s]/g, " ")
            .replace(/\s+/g, " ")
            .trim();

        const rawAntesComa = limpio.split(",")[0].split(":")[0];
        const callePrincipal = rawAntesComa.split("-")[0]
            .replace(/schimidt/g, "schmidt")
            .replace(/[^a-z0-9\s]/g, " ")
            .replace(/\s+/g, " ")
            .trim();

        return {
            calle: callePrincipal || calle,
            num
        };
    }

    function similitudBigrams(a, b) {
        if (!a || !b) return 0;
        if (a === b) return 1;
        if (a.length < 2 || b.length < 2) return 0;
        if (a.includes(b) || b.includes(a)) return 0.92;

        const getBigrams = (s) => {
            const set = new Map();
            for (let i = 0; i < s.length - 1; i++) {
                const bg = s.slice(i, i + 2);
                set.set(bg, (set.get(bg) || 0) + 1);
            }
            return set;
        };
        const bgA = getBigrams(a);
        const bgB = getBigrams(b);
        let inter = 0;
        for (const [bg, count] of bgA.entries()) {
            if (bgB.has(bg)) inter += Math.min(count, bgB.get(bg));
        }
        return (2 * inter) / ((a.length - 1) + (b.length - 1));
    }

    function distanciaMetros(lat1, lon1, lat2, lon2) {
        if (!coordsValidas(lat1, lon1) || !coordsValidas(lat2, lon2)) return Infinity;
        const R = 6371000;
        const toRad = (g) => g * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function enriquecerYAgrupar() {
        const items = [];
        for (const [codigo, datos] of mapaRuta.entries()) {
            const ex = mapaExcel.get(codigo);
            if (ex) {
                datos.dirCompleta = ex.address || datos.dirPDF;
                datos.bairro = ex.bairro || "";
                datos.lat = ex.lat;
                datos.lon = ex.lon;
            } else {
                datos.dirCompleta = datos.dirPDF;
            }
            const parsed = parsearDireccionInteligente(datos.dirCompleta);
            items.push({ codigo, datos, parsed });
        }

        const n = items.length;
        const padre = Array.from({ length: n }, (_, i) => i);
        const find = (x) => (padre[x] === x ? x : (padre[x] = find(padre[x])));
        const union = (a, b) => {
            const ra = find(a), rb = find(b);
            if (ra !== rb) padre[rb] = ra;
        };

        for (let i = 0; i < n; i++) {
            for (let j = i + 1; j < n; j++) {
                const A = items[i], B = items[j];
                const numA = A.parsed.num, numB = B.parsed.num;

                if (numA !== null && numB !== null && numA !== numB) continue;

                const sim = similitudBigrams(A.parsed.calle, B.parsed.calle);
                const dist = distanciaMetros(A.datos.lat, A.datos.lon, B.datos.lat, B.datos.lon);

                let sonMismoLugar = false;

                if (numA !== null && numA === numB) {
                    if (sim >= 0.72 || dist <= 45) sonMismoLugar = true;
                } else if (numA === null && numB === null) {
                    if (sim >= 0.85 || dist <= 18) sonMismoLugar = true;
                } else {
                    if (sim >= 0.88 && dist <= 30) sonMismoLugar = true;
                    else if (dist <= 12) sonMismoLugar = true;
                }

                if (sonMismoLugar) union(i, j);
            }
        }

        mapaGrupos.clear();
        for (let i = 0; i < n; i++) {
            const root = find(i);
            const gId = `grp_${root}`;
            items[i].datos.grupoId = gId;

            if (!mapaGrupos.has(gId)) {
                mapaGrupos.set(gId, { count: 0, paradas: [], codigos: [] });
            }
            const grp = mapaGrupos.get(gId);
            grp.count += 1;
            grp.paradas.push(items[i].datos.parada);
            grp.codigos.push(items[i].codigo);
        }

        for (const grp of mapaGrupos.values()) {
            grp.paradas.sort((a, b) => a - b);
        }
    }

    // ---------------- EXTRACCIÓN DE COMPLEMENTOS Y ALERTAS ----------------
    function extraerBlocoApto(texto, bairro = "") {
        const combinado = `${texto || ""} ${bairro || ""}`;
        const mBl = combinado.match(/\b(?:bloco|blc\.?|bl\.?|torre)\s*([0-9A-Za-z]+)/i);
        const mAp = combinado.match(/\b(?:apartamento|apart\.?|apto\.?|apt\.?|ap[eê]?\.?)\s*([0-9A-Za-z]+)/i);
        const partes = [];
        if (mBl) partes.push(`Bloco ${mBl[1].toUpperCase()}`);
        if (mAp) partes.push(`Apto ${mAp[1].toUpperCase()}`);
        return partes.join(" / ");
    }

    function detectarAlertas(texto) {
        const alertas = [];
        const t = sinAcentos(texto).toLowerCase().replace(/([a-z])\1{2,}/g, "$1");
        if (/\b(comercio|comercial|horario|loja|padaria|salao|lanchonete|escola|mercado|seg a sex|segunda|barbearia|trabalho|galeria|grafica|emporio|esmalteria|modas|empresa|posto|drogal|loterica|contabilidade|vidracaria|buffet|toop som|borracha|mercearia)\b/.test(t)) {
            alertas.push({ texto: "🏢 COMERCIO / HORARIO", tipo: "" });
        }
        if (/\b(condominio|cond\.|conde\.|bloco|blc|bl\s*\d|torre|apto|apart|apartamento|portaria|interfone)\b/.test(t)) {
            alertas.push({ texto: "🏘️ CONDOMINIO", tipo: "" });
        }
        if (/\b(nao jogar|jogar|garagem|quintal|portao|fundo|frente|placa|entregar|vizinho|bater|chamar|toldo)\b/.test(t)) {
            alertas.push({ texto: "⚠️ LEER NOTA", tipo: "nota" });
        }
        return alertas;
    }

    // ---------------- PERSISTENCIA ----------------
    function guardarEstado() {
        try {
            localStorage.setItem(STORAGE_RUTA, JSON.stringify(Array.from(mapaRuta.entries())));
            localStorage.setItem(STORAGE_EXCEL, JSON.stringify(Array.from(mapaExcel.entries())));
            localStorage.setItem(STORAGE_EXCEL_RAW, JSON.stringify(excelFilasOriginales));
        } catch (e) {
            console.warn("No se pudo guardar en localStorage:", e);
        }
    }

    function restaurarEstado() {
        try {
            const rawEx = localStorage.getItem(STORAGE_EXCEL);
            if (rawEx) mapaExcel = new Map(JSON.parse(rawEx));

            const rawFilas = localStorage.getItem(STORAGE_EXCEL_RAW);
            if (rawFilas) excelFilasOriginales = JSON.parse(rawFilas);

            const rawRuta = localStorage.getItem(STORAGE_RUTA);
            if (rawRuta) {
                const entries = JSON.parse(rawRuta);
                if (Array.isArray(entries) && entries.length > 0) {
                    mapaRuta = new Map(entries);
                    enriquecerYAgrupar();
                    actualizarUIProgreso();
                    actualizarEstadoCargaUI(true);
                    return;
                }
            }
            if (mapaExcel.size > 0 || excelFilasOriginales.length > 0) {
                actualizarEstadoCargaUI(true);
            }
        } catch (e) {
            console.warn("Error restaurando estado:", e);
        }
    }

    function actualizarEstadoCargaUI(restaurado = false) {
        const estadoEl = document.getElementById("estadoCarga");
        const btnExp = document.getElementById("btnExportarRoutin");
        btnExp.style.display = excelFilasOriginales.length > 0 ? "block" : "none";

        if (mapaRuta.size === 0 && mapaExcel.size === 0) {
            estadoEl.innerText = "Esperando archivos...";
            estadoEl.style.color = "#9ca3af";
            return;
        }

        let cruzados = 0;
        for (const cod of mapaRuta.keys()) {
            if (mapaExcel.has(cod)) cruzados++;
        }

        const partes = [];
        if (mapaRuta.size > 0) {
            partes.push(`${restaurado ? "♻️" : "✅"} PDF: ${mapaRuta.size} paquetes (${mapaGrupos.size} direcciones)`);
        }
        if (mapaExcel.size > 0) {
            partes.push(`📊 Excel: ${mapaExcel.size} filas` + (mapaRuta.size > 0 ? ` (${cruzados} cruzados con GPS)` : ""));
        }
        estadoEl.innerText = partes.join(" • ");
        estadoEl.style.color = "#4ade80";
    }

    function limpiarRuta() {
        if (mapaRuta.size === 0 && mapaExcel.size === 0 && excelFilasOriginales.length === 0) return;
        if (!confirm("¿Seguro que quieres borrar la ruta, el Excel y todo el progreso?")) return;
        mapaRuta.clear();
        mapaExcel.clear();
        mapaGrupos.clear();
        excelFilasOriginales = [];
        gruposAbiertos.clear();
        localStorage.removeItem(STORAGE_RUTA);
        localStorage.removeItem(STORAGE_EXCEL);
        localStorage.removeItem(STORAGE_EXCEL_RAW);
        actualizarUIProgreso();
        actualizarEstadoCargaUI();
        document.getElementById("resumenLimpieza").style.display = "none";
        const caja = document.getElementById("resultado");
        caja.className = "";
        caja.innerHTML = `<div style="font-size:1.1rem; font-weight:700;">Esperando escaneo...</div>`;
    }

    function actualizarUIProgreso() {
        const total = mapaRuta.size;
        let cargados = 0;
        for (const d of mapaRuta.values()) {
            if (d.escaneado) cargados++;
        }
        const pct = total > 0 ? Math.round((cargados / total) * 100) : 0;
        document.getElementById("txtProgreso").innerText = `Cargados: ${cargados} / ${total}`;
        document.getElementById("txtPorcentaje").innerText = `${pct}%`;
        document.getElementById("barraFill").style.width = `${pct}%`;
    }

    // ---------------- PROCESAMIENTO DE LECTURA ----------------
    function buscarCodigoEnRuta(codigoRaw) {
        const limpio = codigoRaw.trim().toUpperCase();
        if (mapaRuta.has(limpio)) return { codigo: limpio, datos: mapaRuta.get(limpio) };

        const matchSub = limpio.match(/\b(BR[0-9A-Z]{13})\b/);
        if (matchSub && mapaRuta.has(matchSub[1])) {
            return { codigo: matchSub[1], datos: mapaRuta.get(matchSub[1]) };
        }

        const norm = (s) => s.replace(/S/g, "5").replace(/O/g, "0");
        const buscadoNorm = norm(matchSub ? matchSub[1] : limpio);
        for (const [cod, datos] of mapaRuta.entries()) {
            if (norm(cod) === buscadoNorm) return { codigo: cod, datos };
        }
        return null;
    }

    function procesarLectura(codigoRaw, esManual = false) {
        const ahora = Date.now();
        const codigoTrim = codigoRaw.trim().toUpperCase();

        if (!esManual) {
            if (codigoTrim === ultimoCodigoLeido && (ahora - ultimoTiempoLeido) < COOLDOWN_MS) return;
            ultimoCodigoLeido = codigoTrim;
            ultimoTiempoLeido = ahora;
        }

        const caja = document.getElementById("resultado");

        if (mapaRuta.size === 0) {
            caja.className = "rojo";
            caja.innerHTML = `<div class="parada-num">SUBE TU PDF</div><div class="info-guia">Primero carga el PDF de Routin</div>`;
            emitirBeep("error", "Sube tu PDF primero");
            return;
        }

        const encontrado = buscarCodigoEnRuta(codigoTrim);
        if (!encontrado) {
            caja.className = "rojo";
            caja.innerHTML = `<div class="parada-num">NO ESTÁ EN RUTA</div><div class="info-guia">${esc(codigoTrim)}</div>`;
            emitirBeep("error", "No está en ruta");
            if (navigator.vibrate) navigator.vibrate(250);
            return;
        }

        const { codigo, datos } = encontrado;
        const yaEstabaEscaneado = datos.escaneado;

        if (!yaEstabaEscaneado) {
            datos.escaneado = true;
            guardarEstado();
            actualizarUIProgreso();
        }

        const grp = mapaGrupos.get(datos.grupoId);
        const totalBultos = grp ? grp.count : 1;
        const zona = obtenerZonaFiorino(datos.parada, mapaRuta.size);
        const blocoApto = extraerBlocoApto(datos.dirCompleta, datos.bairro);
        const alertas = detectarAlertas(`${datos.dirCompleta} ${datos.bairro}`);

        let escaneadosDir = 0;
        let mismosApto = 0;
        let chipsHtml = "";

        if (grp && totalBultos > 1) {
            for (const codGrp of grp.codigos) {
                const pkg = mapaRuta.get(codGrp);
                if (!pkg) continue;
                if (pkg.escaneado) escaneadosDir++;
                if (blocoApto && codGrp !== codigo && extraerBlocoApto(pkg.dirCompleta, pkg.bairro) === blocoApto) {
                    mismosApto++;
                }
            }
            const ordenados = grp.codigos
                .map(c => mapaRuta.get(c))
                .filter(Boolean)
                .sort((a, b) => a.parada - b.parada);
            for (const pkg of ordenados) {
                chipsHtml += `<span class="chip-parada ${pkg.escaneado ? "ok" : ""}">#${pkg.parada}${pkg.escaneado ? " ✓" : ""}</span>`;
            }
        }

        const alertasHtml = alertas.length > 0
            ? `<div class="alertas-row">${alertas.map(a => `<span class="alerta-pill ${a.tipo}">${a.texto}</span>`).join("")}</div>`
            : "";

        const avisoMismoApto = mismosApto > 0
            ? `<div style="font-size:0.82rem; color:#bbf7d0; margin-top:4px;">📌 Hay ${mismosApto + 1} bultos para este mismo ${esc(blocoApto)}</div>`
            : "";

        const bultosHtml = totalBultos > 1
            ? `<div class="info-bultos">
                    📦 ${escaneadosDir} de ${totalBultos} BULTOS EN ESTA DIRECCIÓN
                    ${avisoMismoApto}
                    <div class="bultos-paradas">${chipsHtml}</div>
               </div>`
            : `<div class="info-bultos" style="color:#d1fae5;">📦 1 bulto único en esta dirección</div>`;

        const gpsBtnHtml = coordsValidas(datos.lat, datos.lon)
            ? `<a class="btn-mini" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${datos.lat},${datos.lon}">📍 Pin</a>`
            : "";

        caja.className = yaEstabaEscaneado ? "ambar" : "verde";
        caja.innerHTML = `
            <div class="res-top">
                <div class="parada-num">PARADA N° ${datos.parada}</div>
                <div class="zona-badge" style="background:${zona.color};">${zona.texto}</div>
            </div>
            ${yaEstabaEscaneado
                ? `<div class="estado-tag">⚠️ YA ESCANEADO ANTERIORMENTE</div>`
                : `<div class="estado-tag">✅ REGISTRADO EN CARGA</div>`}
            ${alertasHtml}
            ${bultosHtml}
            <div class="info-direccion">
                ${blocoApto ? `<div style="color:#fde047; font-size:1.05rem; margin-bottom:2px;">📍 ${esc(blocoApto)}</div>` : ""}
                ${datos.refShopee ? `<span style="opacity:0.8">[${esc(datos.refShopee)}]</span> ` : ""}${esc(datos.dirCompleta)}
            </div>
            ${datos.bairro ? `<div class="info-bairro">${esc(datos.bairro)}</div>` : ""}
            <div class="info-guia">${esc(codigo)}</div>
            <div class="quick-actions">
                <button class="btn-mini" onclick="copiarMensaje(this, '${esc(codigo)}', 'camino')">💬 Camino</button>
                <button class="btn-mini" onclick="copiarMensaje(this, '${esc(codigo)}', 'puerta')">💬 Puerta</button>
                <button class="btn-mini" onclick="copiarMensaje(this, '${esc(codigo)}', 'ausente')">💬 Ausente</button>
                ${gpsBtnHtml}
                <button class="btn-mini" onclick="desmarcarPaquete('${esc(codigo)}')">Desmarcar</button>
            </div>
        `;

        if (yaEstabaEscaneado) {
            emitirBeep("duplicado", `Repetido, ${datos.parada}`);
            if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
        } else if (totalBultos > 1) {
            emitirBeep("multi", `${datos.parada}, ${totalBultos} bultos`);
            if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
        } else {
            emitirBeep("ok", `${datos.parada}`);
            if (navigator.vibrate) navigator.vibrate(150);
        }
    }

    // ---------------- COPIADO RÁPIDO DE MENSAJES (1 TOQUE) ----------------
    async function copiarMensaje(btn, codigo, tipo) {
        const datos = mapaRuta.get(codigo);
        if (!datos) return;

        const ult4 = codigo.slice(-4);
        let msg = "";

        if (tipo === "camino") {
            msg = `Olá! Sou entregador da Shopee e estou a caminho do seu endereço agora. Por favor, fique atento(a) para receber o seu pedido. Cód: ${ult4}`;
        } else if (tipo === "puerta") {
            msg = `Olá! Sou entregador da Shopee e já estou aqui na frente (ou portaria) com o seu pedido. Pode vir receber, por favor? Cód: ${ult4}`;
        } else {
            msg = `Olá! Chamei no seu endereço com sua entrega da Shopee, mas não recebi resposta. Deseja que algum vizinho receba por você? Se sim, me informe o número da casa, por favor. Cód: ${ult4}`;
        }

        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(msg);
            } else {
                const ta = document.createElement("textarea");
                ta.value = msg;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
            }
            const textoOriginal = btn.innerText;
            btn.innerText = "✅ Copiado";
            btn.classList.add("copiado");
            setTimeout(() => {
                btn.innerText = textoOriginal;
                btn.classList.remove("copiado");
            }, 1400);
        } catch (e) {
            alert("Mensaje listo:\n\n" + msg);
        }
    }

    function desmarcarPaquete(codigo) {
        const datos = mapaRuta.get(codigo);
        if (!datos) return;
        datos.escaneado = false;
        guardarEstado();
        actualizarUIProgreso();
        const caja = document.getElementById("resultado");
        caja.className = "";
        caja.innerHTML = `<div style="font-weight:700;">Parada N° ${datos.parada} desmarcada</div><div class="info-guia">${esc(codigo)}</div>`;
        if (document.getElementById("modalLista").classList.contains("abierto")) {
            renderizarListaModal();
        }
    }

    // ---------------- BÚSQUEDA MANUAL ----------------
    function buscarManual(texto) {
        const cont = document.getElementById("busquedaResultados");
        const q = texto.trim().toUpperCase();
        if (q.length < 2 || mapaRuta.size === 0) {
            cont.innerHTML = "";
            return;
        }

        const coincidencias = [];
        for (const [codigo, datos] of mapaRuta.entries()) {
            const enCodigo = codigo.includes(q);
            const enDir = datos.dirCompleta.toUpperCase().includes(q);
            const enParada = String(datos.parada) === q;
            if (enCodigo || enDir || enParada) coincidencias.push({ codigo, datos });
            if (coincidencias.length >= 6) break;
        }

        if (coincidencias.length === 0) {
            cont.innerHTML = `<div style="font-size:0.82rem; color:#9ca3af;">Sin coincidencias...</div>`;
            return;
        }

        cont.innerHTML = coincidencias.map(({ codigo, datos }) => `
            <div class="busqueda-item">
                <div>
                    <strong>#${datos.parada}</strong> ${datos.escaneado ? "✅" : "⏳"} - ${esc(datos.dirCompleta.slice(0, 50))}
                    <div style="font-size:0.75rem; color:#9ca3af; font-family:monospace;">${esc(codigo)}</div>
                </div>
                <button onclick="seleccionarManual('${esc(codigo)}')">Ubicar</button>
            </div>
        `).join("");
    }

    function seleccionarManual(codigo) {
        document.getElementById("busquedaManual").value = "";
        document.getElementById("busquedaResultados").innerHTML = "";
        procesarLectura(codigo, true);
    }

    // ---------------- MODAL LISTA DE CONTROL (ACORDEÓN MULTIBULTO) ----------------
    function abrirModal() {
        document.getElementById("modalLista").classList.add("abierto");
        renderizarListaModal();
    }
    function cerrarModal() {
        document.getElementById("modalLista").classList.remove("abierto");
    }
    function cambiarTab(tab) {
        tabActual = tab;
        document.getElementById("tabFaltantes").classList.toggle("activa", tab === "faltantes");
        document.getElementById("tabCargados").classList.toggle("activa", tab === "cargados");
        document.getElementById("tabMulti").classList.toggle("activa", tab === "multi");
        renderizarListaModal();
    }
    function toggleGrupoModal(grupoId, estaAbierto) {
        if (estaAbierto) gruposAbiertos.add(grupoId);
        else gruposAbiertos.delete(grupoId);
    }

    function renderizarListaModal() {
        const cont = document.getElementById("listaModalContenido");
        const filtro = document.getElementById("filtroModal").value.trim().toUpperCase();

        if (tabActual === "multi") {
            const grupos = [];
            for (const [gId, grp] of mapaGrupos.entries()) {
                if (grp.count <= 1) continue;
                const paquetes = grp.codigos
                    .map(c => ({ codigo: c, ...mapaRuta.get(c) }))
                    .filter(Boolean)
                    .sort((a, b) => a.parada - b.parada);

                if (filtro) {
                    const coincideGrupo = paquetes.some(p =>
                        p.codigo.includes(filtro) ||
                        p.dirCompleta.toUpperCase().includes(filtro) ||
                        String(p.parada) === filtro
                    );
                    if (!coincideGrupo) continue;
                }
                grupos.push({ gId, grp, paquetes });
            }

            grupos.sort((a, b) => a.paquetes[0].parada - b.paquetes[0].parada);

            if (grupos.length === 0) {
                cont.innerHTML = `<div style="text-align:center; color:#9ca3af; padding:20px;">No hay paradas multibulto.</div>`;
                return;
            }

            cont.innerHTML = grupos.map(({ gId, grp, paquetes }) => {
                const cargados = paquetes.filter(p => p.escaneado).length;
                const completo = cargados === grp.count;
                const paradasTxt = paquetes.map(p => `#${p.parada}`).join(", ");
                const baseDir = paquetes[0].dirCompleta.split(",").slice(0, 2).join(",");
                const abiertoAttr = (gruposAbiertos.has(gId) || filtro) ? "open" : "";

                const subFilasHtml = paquetes.map(p => {
                    const bl = extraerBlocoApto(p.dirCompleta, p.bairro);
                    return `
                        <div class="multi-subrow">
                            <div>
                                <strong>#${p.parada}</strong> ${p.escaneado ? "✅" : "⏳"}
                                ${bl ? `<span style="color:#fde047; font-weight:700;">• ${esc(bl)}</span>` : ""}
                                <div>${esc(p.dirCompleta)}</div>
                                <small>${esc(p.codigo)}</small>
                            </div>
                            <button class="btn-icon" onclick="${p.escaneado ? `desmarcarPaquete('${esc(p.codigo)}')` : `procesarLectura('${esc(p.codigo)}', true); renderizarListaModal();`}">
                                ${p.escaneado ? "Quitar" : "Cargar"}
                            </button>
                        </div>
                    `;
                }).join("");

                return `
                    <details class="multi-grupo" ${abiertoAttr} ontoggle="toggleGrupoModal('${gId}', this.open)">
                        <summary class="multi-summary">
                            <div class="multi-titulo">
                                <strong>📦 ${esc(baseDir)}</strong>
                                <small>Paradas: ${esc(paradasTxt)}</small>
                            </div>
                            <span class="multi-badge ${completo ? "completo" : ""}">${cargados} / ${grp.count}${completo ? " ✓" : ""}</span>
                        </summary>
                        <div class="multi-body">${subFilasHtml}</div>
                    </details>
                `;
            }).join("");
            return;
        }

        const items = Array.from(mapaRuta.entries())
            .map(([codigo, datos]) => ({ codigo, ...datos }))
            .sort((a, b) => a.parada - b.parada)
            .filter(item => {
                if (tabActual === "faltantes" && item.escaneado) return false;
                if (tabActual === "cargados" && !item.escaneado) return false;
                if (!filtro) return true;
                return (
                    item.codigo.includes(filtro) ||
                    item.dirCompleta.toUpperCase().includes(filtro) ||
                    String(item.parada) === filtro
                );
            });

        if (items.length === 0) {
            cont.innerHTML = `<div style="text-align:center; color:#9ca3af; padding:20px;">No hay paquetes en esta vista.</div>`;
            return;
        }

        cont.innerHTML = items.map(item => {
            const grp = mapaGrupos.get(item.grupoId);
            const multiTag = (grp && grp.count > 1) ? ` • 📦 x${grp.count}` : "";
            return `
                <div class="lista-row">
                    <div>
                        <strong>Parada #${item.parada}${multiTag}</strong> ${item.escaneado ? "✅" : ""}
                        <div>${esc(item.dirCompleta)}</div>
                        <small>${esc(item.codigo)}</small>
                    </div>
                    <button class="btn-icon" onclick="${item.escaneado ? `desmarcarPaquete('${esc(item.codigo)}')` : `procesarLectura('${esc(item.codigo)}', true); renderizarListaModal();`}">
                        ${item.escaneado ? "Quitar" : "Cargar"}
                    </button>
                </div>
            `;
        }).join("");
    }

    // ---------------- CÁMARA Y LINTERNA ----------------
    async function iniciarEscaner() {
        if (isScannerRunning || scannerBusy || scannerPausadoManual) return;
        scannerBusy = true;

        try {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader", {
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.QR_CODE,
                        Html5QrcodeSupportedFormats.CODE_128
                    ],
                    experimentalFeatures: {
                        useBarCodeDetectorIfSupported: true
                    }
                });
            }

            await html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 12,
                    qrbox: (w, h) => {
                        const lado = Math.min(250, Math.floor(Math.min(w, h) * 0.72));
                        return { width: lado, height: lado };
                    }
                },
                (decodedText) => procesarLectura(decodedText, false),
                () => {}
            );
            isScannerRunning = true;
            linternaActiva = false;
            document.getElementById("btnLinterna").classList.remove("activo");
        } catch (err) {
            console.warn("No se pudo iniciar cámara:", err);
            isScannerRunning = false;
        } finally {
            scannerBusy = false;
        }
    }

    async function detenerEscaner() {
        if (!isScannerRunning || scannerBusy || !html5QrCode) return;
        scannerBusy = true;
        try {
            await html5QrCode.stop();
        } catch (e) {
        } finally {
            isScannerRunning = false;
            linternaActiva = false;
            document.getElementById("btnLinterna").classList.remove("activo");
            scannerBusy = false;
        }
    }

    async function togglePausaCamara() {
        const btn = document.getElementById("btnPausa");
        if (scannerPausadoManual) {
            scannerPausadoManual = false;
            btn.innerText = "⏸️ Pausar";
            btn.classList.remove("activo");
            await iniciarEscaner();
        } else {
            scannerPausadoManual = true;
            btn.innerText = "▶️ Reanudar";
            btn.classList.add("activo");
            await detenerEscaner();
        }
    }

    async function toggleLinterna() {
        if (!isScannerRunning || !html5QrCode) return;
        const nuevoEstado = !linternaActiva;
        try {
            await html5QrCode.applyVideoConstraints({
                advanced: [{ torch: nuevoEstado }]
            });
            linternaActiva = nuevoEstado;
            document.getElementById("btnLinterna").classList.toggle("activo", linternaActiva);
        } catch (e) {
            alert("Tu navegador o cámara no permite controlar la linterna desde la web.");
        }
    }

    document.addEventListener("visibilitychange", async () => {
        if (document.hidden) {
            await detenerEscaner();
        } else if (!scannerPausadoManual) {
            setTimeout(() => iniciarEscaner(), 300);
        }
    });

    window.addEventListener("DOMContentLoaded", () => {
        actualizarBtnSonido();
        restaurarEstado();
        iniciarEscaner();
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").catch(() => {});
        }
    });
</script>
