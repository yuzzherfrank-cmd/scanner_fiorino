    // ---------------- PROCESAMIENTO DE LECTURA ----------------
    function buscarCodigoEnMapa(codigoRaw, mapaDestino) {
        const limpio = codigoRaw.trim().toUpperCase();
        if (mapaDestino.has(limpio)) return { codigo: limpio, datos: mapaDestino.get(limpio) };

        const matchSub = limpio.match(/\b(BR[0-9A-Z]{13})\b/);
        if (matchSub && mapaDestino.has(matchSub[1])) {
            return { codigo: matchSub[1], datos: mapaDestino.get(matchSub[1]) };
        }

        const norm = (s) => s.replace(/S/g, "5").replace(/O/g, "0");
        const buscadoNorm = norm(matchSub ? matchSub[1] : limpio);
        for (const [cod, datos] of mapaDestino.entries()) {
            if (norm(cod) === buscadoNorm) return { codigo: cod, datos };
        }
        return null;
    }

    function procesarLectura(codigoRaw, esManual = false) {
        const ahora = Date.now();
        const codigoTrim = codigoRaw.trim().toUpperCase();

        if (!esManual) {
            if (codigoTrim === ultimoCodigoLeido && (ahora - ultimoTiempoLeido) < COOLDOWN_MS) return;
            ultimoCodigoLeido = codigoTrim;
            ultimoTiempoLeido = ahora;
        }

        if (modoEscaneo === "atras") {
            procesarLecturaModoAtras(codigoTrim);
            return;
        }

        const caja = document.getElementById("resultado");

        if (mapaRuta.size === 0) {
            caja.className = "rojo";
            caja.innerHTML = `<div class="parada-num">SUBE TU PDF</div><div class="info-guia">Primero carga el PDF de Routin (o cambia arriba a Modo Va Atrás)</div>`;
            emitirBeep("error");
            setTimeout(() => hablar("Sube tu PDF primero"), 150);
            return;
        }

        const encontrado = buscarCodigoEnMapa(codigoTrim, mapaRuta);
        if (!encontrado) {
            caja.className = "rojo";
            caja.innerHTML = `<div class="parada-num">NO ESTÁ EN RUTA</div><div class="info-guia">${esc(codigoTrim)}</div>`;
            emitirBeep("error");
            setTimeout(() => hablar("No está en ruta"), 150);
            if (navigator.vibrate) navigator.vibrate(250);
            return;
        }

        const { codigo, datos } = encontrado;
        const yaEstabaEscaneado = setEscaneados.has(codigo);

        if (!yaEstabaEscaneado) {
            setEscaneados.add(codigo);
            guardarEstado();
            actualizarUIProgreso();
        }

        renderizarTarjetaPaquete(codigo, datos, yaEstabaEscaneado);

        const grp = mapaGrupos.get(datos.grupoId);
        const totalBultos = grp ? grp.count : 1;
        const vaAtras = setAtras.has(codigo);
        const sufijoVoz = vaAtras ? ". Va atrás" : "";

        if (yaEstabaEscaneado) {
            emitirBeep("duplicado");
            setTimeout(() => hablar(`Repetido. Parada ${datos.parada}${sufijoVoz}`), 220);
            if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
        } else if (totalBultos > 1) {
            emitirBeep("multi");
            setTimeout(() => hablar(`Parada ${datos.parada}. ${totalBultos} bultos${sufijoVoz}`), 260);
            if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
        } else {
            emitirBeep("ok");
            setTimeout(() => hablar(`Parada ${datos.parada}${sufijoVoz}`), 150);
            if (navigator.vibrate) navigator.vibrate(150);
        }
    }

    function procesarLecturaModoAtras(codigoTrim) {
        const caja = document.getElementById("resultado");

        const enRuta = buscarCodigoEnMapa(codigoTrim, mapaRuta);
        const enExcel = !enRuta ? buscarCodigoEnMapa(codigoTrim, mapaExcel) : null;
        const mSub = codigoTrim.match(/\b(BR[0-9A-Z]{13})\b/);
        const codigo = enRuta ? enRuta.codigo : (enExcel ? enExcel.codigo : (mSub ? mSub[1] : codigoTrim));

        const yaEstaba = setAtras.has(codigo);
        if (!yaEstaba) {
            setAtras.add(codigo);
            guardarEstado();
            actualizarContadorAtrasBtn();
        }

        const infoRuta = enRuta ? enRuta.datos : null;
        const infoDir = infoRuta ? infoRuta.dirCompleta : (enExcel ? enExcel.datos.address : "Se vinculará automáticamente al subir Excel/PDF");
        const paradaTexto = infoRuta ? `PARADA N° ${infoRuta.parada}` : `GUARDADO ATRÁS (${setAtras.size})`;

        caja.className = yaEstaba ? "ambar" : "morado";
        caja.innerHTML = `
            <div class="res-top">
                <div class="parada-num">${paradaTexto}</div>
                <div class="zona-badge" style="background:#f97316;">🚚 VA ATRÁS</div>
            </div>
            <div class="estado-tag">
                ${yaEstaba ? "⚠️ YA ESTABA MARCADO PARA ATRÁS" : `✅ MARCADO PARA ATRÁS (Total: ${setAtras.size})`}
            </div>
            <div class="info-direccion">${esc(infoDir)}</div>
            <div class="info-guia">${esc(codigo)}</div>
            <div class="quick-actions">
                <button class="btn-mini" onclick="togglePaqueteAtras('${esc(codigo)}', false)">↩️ Quitar de atrás</button>
            </div>
        `;

        if (yaEstaba) {
            emitirBeep("duplicado");
            setTimeout(() => hablar(infoRuta ? `Ya marcado atrás. Parada ${infoRuta.parada}` : "Ya marcado atrás"), 200);
            if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
        } else {
            emitirBeep("atras");
            setTimeout(() => hablar(infoRuta ? `Atrás. Parada ${infoRuta.parada}` : "Marcado atrás"), 180);
            if (navigator.vibrate) navigator.vibrate([100, 50, 140]);
        }
    }

    function renderizarTarjetaPaquete(codigo, datos, yaEstabaEscaneado) {
        const caja = document.getElementById("resultado");
        const grp = mapaGrupos.get(datos.grupoId);
        const totalBultos = grp ? grp.count : 1;
        const zona = obtenerZonaFiorino(datos.parada, mapaRuta.size);
        const blocoApto = extraerBlocoApto(datos.dirCompleta);
        const alertas = detectarAlertas(datos.dirCompleta);
        const vaAtras = setAtras.has(codigo);

        let escaneadosDir = 0;
        let mismosApto = 0;
        let chipsHtml = "";

        if (grp && totalBultos > 1) {
            for (const codGrp of grp.codigos) {
                const pkg = mapaRuta.get(codGrp);
                if (!pkg) continue;
                if (setEscaneados.has(codGrp)) escaneadosDir++;
                if (blocoApto && codGrp !== codigo && extraerBlocoApto(pkg.dirCompleta) === blocoApto) {
                    mismosApto++;
                }
            }
            const ordenados = grp.codigos
                .map(c => ({ c, d: mapaRuta.get(c) }))
                .filter(x => x.d)
                .sort((a, b) => a.d.parada - b.d.parada);
            for (const { c, d } of ordenados) {
                const ok = setEscaneados.has(c);
                chipsHtml += `<span class="chip-parada ${ok ? "ok" : ""}">#${d.parada}${ok ? " ✓" : ""}</span>`;
            }
        }

        if (datos.esPinSospechoso) {
            alertas.push({ texto: `📍 ${datos.motivoSospecha || "PIN DUDOSO"}`, tipo: "pin" });
        }

        const alertasHtml = alertas.length > 0
            ? `<div class="alertas-row">${alertas.map(a => `<span class="alerta-pill ${a.tipo}">${esc(a.texto)}</span>`).join("")}</div>`
            : "";

        const avisoMismoApto = mismosApto > 0
            ? `<div style="font-size:0.82rem; color:#bbf7d0; margin-top:4px;">📌 Hay ${mismosApto + 1} bultos para este mismo ${esc(blocoApto)}</div>`
            : "";

        const bultosHtml = totalBultos > 1
            ? `<div class="info-bultos">
                    📦 ${escaneadosDir} de ${totalBultos} BULTOS EN ESTA DIRECCIÓN
                    ${avisoMismoApto}
                    <div class="bultos-paradas">${chipsHtml}</div>
               </div>`
            : `<div class="info-bultos" style="color:#d1fae5;">📦 1 bulto único en esta dirección</div>`;

        const gpsBtnHtml = (datos.lat !== null && datos.lon !== null)
            ? `<a class="btn-mini" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${datos.lat},${datos.lon}">📍 Pin</a>`
            : "";

        caja.className = yaEstabaEscaneado ? "ambar" : "verde";
        caja.innerHTML = `
            <div class="res-top">
                <div class="parada-num">PARADA N° ${datos.parada}</div>
                <div class="zona-badge" style="background:${zona.color};">${zona.texto}</div>
            </div>
            ${vaAtras ? `<div class="badge-atras-grande">🚚 PAQUETE GRANDE / UBICADO ATRÁS</div>` : ""}
            ${yaEstabaEscaneado
                ? `<div class="estado-tag">⚠️ YA ESCANEADO ANTERIORMENTE</div>`
                : `<div class="estado-tag">✅ REGISTRADO EN CARGA</div>`}
            ${alertasHtml}
            ${bultosHtml}
            <div class="info-direccion">
                ${blocoApto ? `<div style="color:#fde047; font-size:1.05rem; margin-bottom:2px;">📍 ${esc(blocoApto)}</div>` : ""}
                ${datos.refShopee ? `<span style="opacity:0.8">[${esc(datos.refShopee)}]</span> ` : ""}${esc(datos.dirCompleta)}
            </div>
            ${datos.bairro ? `<div class="info-bairro">${esc(datos.bairro)}</div>` : ""}
            <div class="info-guia">${esc(codigo)}</div>
            <div class="quick-actions">
                <button class="btn-mini ${vaAtras ? "atras-on" : ""}" onclick="togglePaqueteAtras('${esc(codigo)}')">
                    ${vaAtras ? "↩️ Quitar atrás" : "📦 Mandar atrás"}
                </button>
                <button class="btn-mini" onclick="copiarMensaje(this, '${esc(codigo)}', 'camino')">💬 Camino</button>
                <button class="btn-mini" onclick="copiarMensaje(this, '${esc(codigo)}', 'puerta')">💬 Puerta</button>
                <button class="btn-mini" onclick="copiarMensaje(this, '${esc(codigo)}', 'ausente')">💬 Ausente</button>
                ${gpsBtnHtml}
                <button class="btn-mini" onclick="desmarcarPaquete('${esc(codigo)}')">Desmarcar</button>
            </div>
        `;
    }

    function togglePaqueteAtras(codigo, forzarEstado = null) {
        const nuevoEstado = forzarEstado !== null ? forzarEstado : !setAtras.has(codigo);
        if (nuevoEstado) setAtras.add(codigo);
        else setAtras.delete(codigo);

        guardarEstado();
        actualizarContadorAtrasBtn();

        if (modoEscaneo === "atras" && !nuevoEstado) {
            const caja = document.getElementById("resultado");
            caja.className = "";
            caja.innerHTML = `<div style="font-weight:700;">Quitado de 'Va atrás'</div><div class="info-guia">${esc(codigo)}</div>`;
        } else if (mapaRuta.has(codigo)) {
            renderizarTarjetaPaquete(codigo, mapaRuta.get(codigo), setEscaneados.has(codigo));
        }

        if (document.getElementById("modalLista").classList.contains("abierto")) {
            renderizarListaModal();
        }
    }

    // ---------------- COPIADO RÁPIDO DE MENSAJES ----------------
    async function copiarMensaje(btn, codigo, tipo) {
        if (!mapaRuta.has(codigo)) return;
        const cod4 = codigo.slice(-4);
        let msg = "";
        if (tipo === "camino") {
            msg = `Olá! Sou entregador da Shopee e estou a caminho do seu endereço agora. Por favor, fique atento(a) para receber o seu pedido. Cód: ${cod4}`;
        } else if (tipo === "puerta") {
            msg = `Olá! Sou entregador da Shopee e já estou aqui na frente (ou portaria) com o seu pedido. Pode vir receber, por favor? Cód: ${cod4}`;
        } else {
            msg = `Olá! Chamei no seu endereço com sua entrega da Shopee, mas não recebi resposta. Deseja que algum vizinho receba por você? Se sim, me informe o número da casa, por favor. Cód: ${cod4}`;
        }

        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(msg);
            } else {
                const ta = document.createElement("textarea");
                ta.value = msg;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
            }
            const textoOriginal = btn.innerText;
            btn.innerText = "✅ Copiado";
            btn.classList.add("copiado");
            setTimeout(() => {
                btn.innerText = textoOriginal;
                btn.classList.remove("copiado");
            }, 1400);
        } catch (e) {
            alert("Mensaje listo:\n\n" + msg);
        }
    }

    function desmarcarPaquete(codigo) {
        if (!mapaRuta.has(codigo)) return;
        const datos = mapaRuta.get(codigo);
        setEscaneados.delete(codigo);
        guardarEstado();
        actualizarUIProgreso();

        const caja = document.getElementById("resultado");
        caja.className = "";
        caja.innerHTML = `<div style="font-weight:700;">Parada N° ${datos.parada} desmarcada</div><div class="info-guia">${esc(codigo)}</div>`;
        if (document.getElementById("modalLista").classList.contains("abierto")) {
            renderizarListaModal();
        }
    }

    // ---------------- BÚSQUEDA MANUAL ----------------
    function buscarManual(texto) {
        const cont = document.getElementById("busquedaResultados");
        const q = texto.trim().toUpperCase();
        if (q.length < 2 || mapaRuta.size === 0) {
            cont.innerHTML = "";
            return;
        }

        const coincidencias = [];
        for (const [codigo, datos] of mapaRuta.entries()) {
            const enCodigo = codigo.includes(q);
            const enDir = datos.dirCompleta.toUpperCase().includes(q);
            const enBairro = (datos.bairro || "").toUpperCase().includes(q);
            const enParada = String(datos.parada) === q;
            if (enCodigo || enDir || enBairro || enParada) coincidencias.push({ codigo, datos });
            if (coincidencias.length >= 6) break;
        }

        if (coincidencias.length === 0) {
            cont.innerHTML = `<div style="font-size:0.82rem; color:#9ca3af;">Sin coincidencias...</div>`;
            return;
        }

        cont.innerHTML = coincidencias.map(({ codigo, datos }) => {
            const ok = setEscaneados.has(codigo);
            const atrasTag = setAtras.has(codigo) ? "🚚" : "";
            return `
                <div class="busqueda-item">
                    <div class="lista-row-info">
                        <strong>#${datos.parada}</strong> ${ok ? "✅" : "⏳"} ${atrasTag} - ${esc(datos.dirCompleta.slice(0, 48))}
                        <div style="font-size:0.75rem; color:#9ca3af; font-family:monospace;">${esc(codigo)}</div>
                    </div>
                    <button onclick="seleccionarManual('${esc(codigo)}')">Ubicar</button>
                </div>
            `;
        }).join("");
    }

    function seleccionarManual(codigo) {
        document.getElementById("busquedaManual").value = "";
        document.getElementById("busquedaResultados").innerHTML = "";
        if (modoEscaneo === "atras") cambiarModoEscaneo("secuencia");
        procesarLectura(codigo, true);
    }

    // ---------------- MODAL LISTA DE CONTROL ----------------
    function abrirModal() {
        document.getElementById("modalLista").classList.add("abierto");
        document.body.style.overflow = "hidden";
        renderizarListaModal();
    }
    function cerrarModal() {
        document.getElementById("modalLista").classList.remove("abierto");
        document.body.style.overflow = "";
    }
    function cambiarTab(tab) {
        tabActual = tab;
        document.getElementById("tabFaltantes").classList.toggle("activa", tab === "faltantes");
        document.getElementById("tabCargados").classList.toggle("activa", tab === "cargados");
        document.getElementById("tabMulti").classList.toggle("activa", tab === "multi");
        document.getElementById("tabAtras").classList.toggle("activa", tab === "atras");
        renderizarListaModal();
    }

    function actualizarContadoresTabs() {
        let faltantes = 0, cargados = 0, multiDirs = 0;
        for (const cod of mapaRuta.keys()) {
            if (setEscaneados.has(cod)) cargados++;
            else faltantes++;
        }
        for (const g of mapaGrupos.values()) {
            if (g.count > 1) multiDirs++;
        }
        document.getElementById("tabFaltantes").innerText = `Faltan (${faltantes})`;
        document.getElementById("tabCargados").innerText = `Listos (${cargados})`;
        document.getElementById("tabMulti").innerText = `Multi (${multiDirs})`;
        document.getElementById("tabAtras").innerText = `Atrás (${setAtras.size})`;
    }

    function renderizarListaModal() {
        actualizarContadoresTabs();
        const cont = document.getElementById("listaModalContenido");
        const filtro = document.getElementById("filtroModal").value.trim().toUpperCase();

        if (tabActual === "atras") {
            const listaAtras = Array.from(setAtras).map(codigo => {
                const d = mapaRuta.get(codigo);
                const ex = mapaExcel.get(codigo);
                return {
                    codigo,
                    parada: d ? d.parada : null,
                    dir: d ? d.dirCompleta : (ex ? ex.address : "Sin archivos cargados aún"),
                    escaneado: setEscaneados.has(codigo)
                };
            }).sort((a, b) => (a.parada ?? 9999) - (b.parada ?? 9999))
              .filter(item => !filtro || item.codigo.includes(filtro) || item.dir.toUpperCase().includes(filtro) || String(item.parada) === filtro);

            if (listaAtras.length === 0) {
                cont.innerHTML = `<div style="text-align:center; color:#9ca3af; padding:20px;">No hay paquetes marcados para ir atrás.</div>`;
                return;
            }

            cont.innerHTML = listaAtras.map(item => `
                <div class="lista-row">
                    <div class="lista-row-info">
                        <strong>${item.parada !== null ? `Parada #${item.parada}` : "⏳ Pendiente de ruta"}</strong> ${item.escaneado ? "✅" : ""} 🚚
                        <div>${esc(item.dir)}</div>
                        <small>${esc(item.codigo)}</small>
                    </div>
                    <button class="btn-icon" onclick="togglePaqueteAtras('${esc(item.codigo)}', false)">Quitar</button>
                </div>
            `).join("");
            return;
        }

        if (tabActual === "multi") {
            const grupos = [];
            for (const [gId, grp] of mapaGrupos.entries()) {
                if (grp.count <= 1) continue;
                const paquetes = grp.codigos
                    .map(c => ({ codigo: c, ...mapaRuta.get(c), escaneado: setEscaneados.has(c) }))
                    .sort((a, b) => a.parada - b.parada);

                if (filtro) {
                    const hayMatch = paquetes.some(p =>
                        p.codigo.includes(filtro) ||
                        p.dirCompleta.toUpperCase().includes(filtro) ||
                        (p.bairro || "").toUpperCase().includes(filtro) ||
                        String(p.parada) === filtro
                    );
                    if (!hayMatch) continue;
                }
                grupos.push({ gId, paquetes, primeraParada: paquetes[0].parada });
            }

            grupos.sort((a, b) => a.primeraParada - b.primeraParada);

            if (grupos.length === 0) {
                cont.innerHTML = `<div style="text-align:center; color:#9ca3af; padding:20px;">No hay direcciones con múltiples bultos.</div>`;
                return;
            }

            cont.innerHTML = grupos.map(g => {
                const cargados = g.paquetes.filter(p => p.escaneado).length;
                const total = g.paquetes.length;
                const dirMuestra = g.paquetes[0].dirCompleta.split(",").slice(0, 2).join(",");
                const chipsParadas = g.paquetes.map(p => `#${p.parada}${p.escaneado ? "✓" : ""}`).join(", ");

                const filasHtml = g.paquetes.map(item => `
                    <div class="lista-row">
                        <div class="lista-row-info">
                            <strong>Parada #${item.parada}</strong> ${item.escaneado ? "✅" : "⏳"} ${setAtras.has(item.codigo) ? "🚚" : ""}
                            <div>${esc(item.dirCompleta)}</div>
                            <small>${esc(item.codigo)}</small>
                        </div>
                        <button class="btn-icon" onclick="${item.escaneado ? `desmarcarPaquete('${esc(item.codigo)}')` : `procesarLectura('${esc(item.codigo)}', true); renderizarListaModal();`}">
                            ${item.escaneado ? "Quitar" : "Cargar"}
                        </button>
                    </div>
                `).join("");

                return `
                    <details class="multi-group">
                        <summary>
                            <div class="multi-summary-top">
                                <span>📦 ${total} bultos (${cargados}/${total})</span>
                                <span style="color:#9ca3af; font-size:0.75rem;">Tocar para ver ▼</span>
                            </div>
                            <div><strong>${esc(dirMuestra)}</strong></div>
                            <div class="multi-summary-sub">Paradas: ${esc(chipsParadas)}</div>
                        </summary>
                        <div class="multi-group-body">${filasHtml}</div>
                    </details>
                `;
            }).join("");
            return;
        }

        const items = Array.from(mapaRuta.entries())
            .map(([codigo, datos]) => ({ codigo, ...datos, escaneado: setEscaneados.has(codigo) }))
            .sort((a, b) => a.parada - b.parada)
            .filter(item => {
                if (tabActual === "faltantes" && item.escaneado) return false;
                if (tabActual === "cargados" && !item.escaneado) return false;
                if (!filtro) return true;
                return (
                    item.codigo.includes(filtro) ||
                    item.dirCompleta.toUpperCase().includes(filtro) ||
                    (item.bairro || "").toUpperCase().includes(filtro) ||
                    String(item.parada) === filtro
                );
            });

        if (items.length === 0) {
            cont.innerHTML = `<div style="text-align:center; color:#9ca3af; padding:20px;">No hay paquetes en esta vista.</div>`;
            return;
        }

        cont.innerHTML = items.map(item => {
            const grp = mapaGrupos.get(item.grupoId);
            const multiTag = (grp && grp.count > 1) ? ` • 📦 x${grp.count}` : "";
            const atrasTag = setAtras.has(item.codigo) ? " 🚚" : "";
            return `
                <div class="lista-row">
                    <div class="lista-row-info">
                        <strong>Parada #${item.parada}${multiTag}</strong> ${item.escaneado ? "✅" : ""}${atrasTag}
                        <div>${esc(item.dirCompleta)}</div>
                        <small>${esc(item.codigo)}</small>
                    </div>
                    <button class="btn-icon" onclick="${item.escaneado ? `desmarcarPaquete('${esc(item.codigo)}')` : `procesarLectura('${esc(item.codigo)}', true); renderizarListaModal();`}">
                        ${item.escaneado ? "Quitar" : "Cargar"}
                    </button>
                </div>
            `;
        }).join("");
    }

    // ---------------- CÁMARA, SELFIE (ESPEJO) Y LINTERNA ----------------
    async function iniciarEscaner() {
        if (isScannerRunning || scannerBusy || scannerPausadoManual) return;
        scannerBusy = true;

        try {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader", {
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.QR_CODE,
                        Html5QrcodeSupportedFormats.CODE_128
                    ],
                    experimentalFeatures: {
                        useBarCodeDetectorIfSupported: true
                    }
                });
            }

            document.getElementById("scannerWrap").classList.toggle("modo-selfie", usarCamaraFrontal);

            await html5QrCode.start(
                { facingMode: usarCamaraFrontal ? "user" : "environment" },
                {
                    fps: 12,
                    qrbox: (w, h) => {
                        const lado = Math.min(250, Math.floor(Math.min(w, h) * 0.72));
                        return { width: lado, height: lado };
                    }
                },
                (decodedText) => procesarLectura(decodedText, false),
                () => {}
            );
            isScannerRunning = true;
            linternaActiva = false;
            document.getElementById("btnLinterna").classList.remove("activo");
        } catch (err) {
            console.warn("No se pudo iniciar cámara:", err);
            isScannerRunning = false;
        } finally {
            scannerBusy = false;
        }
    }

    async function detenerEscaner() {
        if (!isScannerRunning || scannerBusy || !html5QrCode) return;
        scannerBusy = true;
        try {
            await html5QrCode.stop();
        } catch (e) {
        } finally {
            isScannerRunning = false;
            linternaActiva = false;
            document.getElementById("btnLinterna").classList.remove("activo");
            scannerBusy = false;
        }
    }

    async function toggleCamaraFrontal() {
        if (scannerBusy) return;
        const estabaCorriendo = isScannerRunning;
        if (estabaCorriendo) {
            await detenerEscaner();
            await new Promise(r => setTimeout(r, 150));
        }
        usarCamaraFrontal = !usarCamaraFrontal;
        const btn = document.getElementById("btnCamara");
        btn.classList.toggle("activo", usarCamaraFrontal);
        btn.innerText = usarCamaraFrontal ? "📷 Trasera" : "🤳 Selfie";
        document.getElementById("scannerWrap").classList.toggle("modo-selfie", usarCamaraFrontal);

        if (estabaCorriendo && !scannerPausadoManual) {
            await iniciarEscaner();
        }
    }

    async function togglePausaCamara() {
        const btn = document.getElementById("btnPausa");
        if (scannerPausadoManual) {
            scannerPausadoManual = false;
            btn.innerText = "⏸️ Pausar";
            btn.classList.remove("activo");
            await iniciarEscaner();
        } else {
            scannerPausadoManual = true;
            btn.innerText = "▶️ Reanudar";
            btn.classList.add("activo");
            await detenerEscaner();
        }
    }

    async function toggleLinterna() {
        if (usarCamaraFrontal) {
            alert("La cámara frontal (selfie) no tiene linterna.");
            return;
        }
        if (!isScannerRunning || !html5QrCode) return;
        const nuevoEstado = !linternaActiva;
        try {
            await html5QrCode.applyVideoConstraints({
                advanced: [{ torch: nuevoEstado }]
            });
            linternaActiva = nuevoEstado;
            document.getElementById("btnLinterna").classList.toggle("activo", linternaActiva);
        } catch (e) {
            alert("Tu navegador o cámara no permite controlar la linterna desde la web.");
        }
    }

    document.addEventListener("visibilitychange", async () => {
        if (document.hidden) {
            await detenerEscaner();
        } else if (!scannerPausadoManual) {
            setTimeout(() => iniciarEscaner(), 300);
        }
    });

    window.addEventListener("DOMContentLoaded", () => {
        restaurarEstado();
        iniciarEscaner();
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").catch(() => {});
        }
    });
</script>
