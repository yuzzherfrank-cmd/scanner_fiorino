<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Escáner Pro - Carga Fiorino</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #101216;
            --card: #1b1f27;
            --card-2: #252b36;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --green: #15803d;
            --amber: #b45309;
            --red: #b91c1c;
            --blue: #2563eb;
            --border: #303746;
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px 12px 40px;
            -webkit-tap-highlight-color: transparent;
        }

        .container { max-width: 460px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header h1 { font-size: 1.15rem; margin: 0; font-weight: 700; }
        .header-actions { display: flex; gap: 6px; }

        .btn-icon {
            background: var(--card-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-icon.activo { background: #eab308; color: #000; border-color: #eab308; }
        .btn-icon.peligro { color: #fca5a5; }

        .progreso-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .progreso-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .barra-bg {
            width: 100%;
            height: 10px;
            background: #2d3340;
            border-radius: 999px;
            overflow: hidden;
        }
        .barra-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            transition: width 0.25s ease;
        }

        .scanner-wrap {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }
        #reader { width: 100%; min-height: 220px; }
        .scanner-controls {
            display: flex;
            gap: 8px;
            padding: 8px;
            background: var(--card);
            border-top: 1px solid var(--border);
        }
        .scanner-controls button { flex: 1; }

        /* Tarjeta de Resultado (Protagonista) */
        #resultado {
            border-radius: 12px;
            padding: 16px 14px;
            margin-bottom: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            text-align: center;
            transition: background 0.15s ease;
        }
        #resultado.verde { background: var(--green); border-color: #22c55e; }
        #resultado.ambar { background: var(--amber); border-color: #f59e0b; }
        #resultado.rojo { background: var(--red); border-color: #ef4444; }

        .res-top {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .parada-num { font-size: 2.05rem; font-weight: 900; letter-spacing: -0.5px; line-height: 1.1; }
        .zona-badge {
            font-size: 0.85rem;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
        }
        .estado-tag {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.28);
        }
        .alertas-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }
        .alerta-pill {
            font-size: 0.74rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            background: #fef08a;
            color: #422006;
        }
        .alerta-pill.nota { background: #fed7aa; color: #431407; }

        .info-bultos {
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.28);
            font-size: 0.98rem;
            font-weight: 700;
            color: #fef08a;
        }
        .bultos-paradas {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-top: 6px;
        }
        .chip-parada {
            font-size: 0.78rem;
            padding: 2px 7px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
        }
        .chip-parada.ok {
            background: #22c55e;
            color: #052e16;
            font-weight: 800;
        }
        .info-direccion {
            margin-top: 10px;
            font-size: 0.96rem;
            line-height: 1.35;
            font-weight: 600;
            color: #fff;
        }
        .info-bairro {
            margin-top: 3px;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.85);
        }
        .info-guia {
            margin-top: 6px;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.78);
            font-family: monospace;
        }

        .quick-actions {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }
        .btn-mini {
            background: rgba(0, 0, 0, 0.32);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 6px;
            padding: 5px 9px;
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-mini.copiado { background: #fef08a; color: #000; border-color: #fef08a; }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .panel label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--muted);
        }
        .file-group { margin-bottom: 10px; }
        .file-group:last-of-type { margin-bottom: 0; }

        input[type="text"], input[type="file"] {
            width: 100%;
            background: var(--card-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 10px;
            font-size: 0.92rem;
        }
        .busqueda-resultados {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .busqueda-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: var(--card-2);
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.84rem;
        }
        .busqueda-item button {
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 7px 10px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }
        .estado-carga {
            margin-top: 8px;
            font-size: 0.83rem;
            color: var(--muted);
            line-height: 1.35;
        }

        /* Modal corregido para scroll táctil perfecto en Android */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            padding: 12px;
        }
        .modal-backdrop.abierto {
            display: flex;
            justify-content: center;
            align-items: stretch;
        }
        .modal-box {
            width: 100%;
            max-width: 460px;
            height: 100%;
            max-height: calc(100dvh - 24px);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .tab-btn {
            flex: 1;
            background: var(--card-2);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 4px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
        }
        .tab-btn.activa { background: var(--blue); color: #fff; border-color: var(--blue); }
        #filtroModal { flex-shrink: 0; }

        /* IMPORTANTE: display:block evita que flexbox aplaste tarjetas con scroll */
        .lista-items {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            display: block;
            margin-top: 10px;
            padding-right: 2px;
        }
        .lista-row {
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.84rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .lista-row-info {
            flex: 1 1 auto;
            min-width: 0;
            word-break: break-word;
            line-height: 1.35;
        }
        .lista-row small { color: var(--muted); display: block; margin-top: 3px; font-family: monospace; }

        /* Tarjetas agrupadas en Multibulto */
        .multi-group {
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .multi-group summary {
            padding: 10px 12px;
            cursor: pointer;
            list-style: none;
            font-size: 0.86rem;
            line-height: 1.35;
        }
        .multi-group summary::-webkit-details-marker { display: none; }
        .multi-summary-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: #fde047;
            margin-bottom: 3px;
        }
        .multi-summary-sub {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 3px;
        }
        .multi-group-body {
            border-top: 1px solid var(--border);
            padding: 8px;
            background: #151921;
        }
        .multi-group-body .lista-row {
            background: var(--card);
            margin-bottom: 6px;
        }
        .multi-group-body .lista-row:last-child { margin-bottom: 0; }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>Escáner Fiorino Pro</h1>
        <div class="header-actions">
            <button id="btnSonido" class="btn-icon activo" onclick="toggleSonido()">🔊 Sonido</button>
            <button class="btn-icon" onclick="abrirModal()">📋 Lista</button>
        </div>
    </div>

    <div class="progreso-box">
        <div class="progreso-top">
            <span id="txtProgreso">Cargados: 0 / 0</span>
            <span id="txtPorcentaje">0%</span>
        </div>
        <div class="barra-bg">
            <div id="barraFill" class="barra-fill"></div>
        </div>
    </div>

    <div class="scanner-wrap">
        <div id="reader"></div>
        <div class="scanner-controls">
            <button id="btnLinterna" class="btn-icon" onclick="toggleLinterna()">🔦 Linterna</button>
            <button id="btnPausa" class="btn-icon" onclick="togglePausaCamara()">⏸️ Pausar</button>
        </div>
    </div>

    <div id="resultado">
        <div style="font-size:1.1rem; font-weight:700;">Esperando escaneo...</div>
        <div class="info-guia">Apunta a cualquiera de los 3 QR o al código de barras</div>
    </div>

    <div class="panel">
        <label for="busquedaManual">Búsqueda rápida (últimos dígitos, calle o bloque):</label>
        <input type="text" id="busquedaManual" placeholder="Ej: 51188X, Rubi o 221" oninput="buscarManual(this.value)">
        <div id="busquedaResultados" class="busqueda-resultados"></div>
    </div>

    <div class="panel">
        <div class="file-group">
            <label for="subirPdf">1. PDF de Routin (Orden de paradas):</label>
            <input type="file" id="subirPdf" accept="application/pdf" onchange="cargarPDF(event)">
        </div>
        <div class="file-group">
            <label for="subirExcel">2. Excel de Shopee .xlsx / .csv (Opcional: GPS y notas completas):</label>
            <input type="file" id="subirExcel" accept=".xlsx,.xls,.csv" onchange="cargarExcel(event)">
        </div>
        <div id="estadoCarga" class="estado-carga">Esperando archivos...</div>
        <div style="margin-top:8px; display:flex; justify-content:flex-end;">
            <button class="btn-icon peligro" onclick="limpiarRuta()">🗑️ Limpiar ruta guardada</button>
        </div>
    </div>

</div>

<!-- Modal Lista de Control -->
<div id="modalLista" class="modal-backdrop" onclick="if(event.target === this) cerrarModal()">
    <div class="modal-box">
        <div class="modal-header">
            <strong style="font-size:1rem;">Control de Ruta</strong>
            <button class="btn-icon" onclick="cerrarModal()">✖ Cerrar</button>
        </div>
        <div class="tabs">
            <button class="tab-btn activa" id="tabFaltantes" onclick="cambiarTab('faltantes')">Faltantes</button>
            <button class="tab-btn" id="tabCargados" onclick="cambiarTab('cargados')">Cargados</button>
            <button class="tab-btn" id="tabMulti" onclick="cambiarTab('multi')">Multibulto</button>
        </div>
        <input type="text" id="filtroModal" placeholder="Filtrar por parada, calle, bloque o BR..." oninput="renderizarListaModal()">
        <div id="listaModalContenido" class="lista-items"></div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const STORAGE_RUTA = "escaner_fiorino_ruta_v2";
    const STORAGE_EXCEL = "escaner_fiorino_excel_v2";

    let html5QrCode = null;
    let isScannerRunning = false;
    let scannerPausadoManual = false;
    let scannerBusy = false;
    let linternaActiva = false;

    let sonidoActivo = true;
    let audioCtx = null;

    let ultimoCodigoLeido = "";
    let ultimoTiempoLeido = 0;
    const COOLDOWN_MS = 2500;

    let mapaRuta = new Map();
    let mapaExcel = new Map();
    let mapaGrupos = new Map();
    let tabActual = "faltantes";

    // ---------------- AUDIO ----------------
    function desbloquearAudio() {
        if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume().catch(() => {});
        }
    }
    document.addEventListener("touchstart", desbloquearAudio, { passive: true });
    document.addEventListener("click", desbloquearAudio, { passive: true });

    function toggleSonido() {
        sonidoActivo = !sonidoActivo;
        const btn = document.getElementById("btnSonido");
        btn.classList.toggle("activo", sonidoActivo);
        btn.innerText = sonidoActivo ? "🔊 Sonido" : "🔇 Mudo";
    }

    function emitirBeep(tipo) {
        if (!sonidoActivo || !audioCtx) return;
        if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});

        const tocar = (freq, dur, delay = 0, wave = "sine") => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = wave;
            osc.frequency.value = freq;
            const start = audioCtx.currentTime + delay;
            gain.gain.setValueAtTime(0.28, start);
            gain.gain.exponentialRampToValueAtTime(0.01, start + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(start);
            osc.stop(start + dur);
        };

        if (tipo === "ok") tocar(920, 0.12);
        else if (tipo === "multi") { tocar(900, 0.1, 0); tocar(1240, 0.15, 0.13); }
        else if (tipo === "duplicado") { tocar(520, 0.1, 0, "triangle"); tocar(420, 0.12, 0.13, "triangle"); }
        else if (tipo === "error") tocar(210, 0.35, 0, "sawtooth");
    }

    // ---------------- UTILIDADES ----------------
    function esc(str) {
        return String(str || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function obtenerZonaFiorino(parada, total) {
        if (total < 4) return { texto: `PARADA #${parada}`, color: "rgba(0,0,0,0.35)" };
        const pct = parada / total;
        if (pct > 0.75) return { texto: "⬆️ FONDO", color: "#4c1d95" };
        if (pct > 0.50) return { texto: "◀️ MEDIO ATRÁS", color: "#1e40af" };
        if (pct > 0.25) return { texto: "▶️ MEDIO ADELANTE", color: "#0f766e" };
        return { texto: "⬇️ PUERTA", color: "#166534" };
    }

    // ---------------- CARGA DE EXCEL SHOPEE (.XLSX / .CSV) ----------------
    async function cargarExcel(e) {
        const archivo = e.target.files[0];
        if (!archivo) return;

        const estadoEl = document.getElementById("estadoCarga");
        estadoEl.innerText = "Leyendo planilla de Shopee...";
        estadoEl.style.color = "#9ca3af";

        try {
            if (typeof XLSX === "undefined") {
                throw new Error("Librería Excel aún no cargada (revisa tu conexión la primera vez).");
            }
            const data = await archivo.arrayBuffer();
            const workbook = XLSX.read(data, { type: "array" });
            const sheetName = workbook.SheetNames[0];
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });

            mapaExcel.clear();

            for (const row of rows) {
                let tn = String(row["SPX TN"] || row["SPX_TN"] || row["TN"] || "").trim().toUpperCase();
                if (!tn) {
                    for (const val of Object.values(row)) {
                        const m = String(val).match(/\b(BR[0-9A-Z]{13})\b/i);
                        if (m) { tn = m[1].toUpperCase(); break; }
                    }
                }
                if (!tn) continue;

                const address = String(row["Destination Address"] || row["Address"] || row["Endereço"] || "").trim();
                const bairro = String(row["Bairro"] || row["Neighborhood"] || "").trim();
                const latRaw = String(row["Latitude"] || row["Lat"] || "").replace(",", ".").trim();
                const lonRaw = String(row["Longitude"] || row["Lon"] || row["Lng"] || "").replace(",", ".").trim();

                const lat = parseFloat(latRaw);
                const lon = parseFloat(lonRaw);

                mapaExcel.set(tn, {
                    address,
                    bairro,
                    lat: Number.isFinite(lat) ? lat : null,
                    lon: Number.isFinite(lon) ? lon : null
                });
            }

            if (mapaRuta.size > 0) {
                enriquecerYAgrupar();
            }
            guardarEstado();
            actualizarEstadoCargaUI();
        } catch (err) {
            console.error(err);
            estadoEl.innerText = "Error al leer Excel: " + err.message;
            estadoEl.style.color = "#f87171";
        } finally {
            e.target.value = "";
        }
    }

    // ---------------- CARGA DE PDF ROUTIN ----------------
    async function cargarPDF(e) {
        const archivo = e.target.files[0];
        if (!archivo) return;

        const estadoEl = document.getElementById("estadoCarga");
        estadoEl.innerText = "Analizando páginas del PDF...";
        estadoEl.style.color = "#9ca3af";

        try {
            const arrayBuffer = await archivo.arrayBuffer();
            const pdfDocument = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const lineas = await extraerLineasPDF(pdfDocument);
            procesarLineasRuta(lineas);
        } catch (err) {
            console.error(err);
            estadoEl.innerText = "Error al leer el PDF: " + err.message;
            estadoEl.style.color = "#f87171";
        } finally {
            e.target.value = "";
        }
    }

    async function extraerLineasPDF(pdfDocument) {
        const lineasTotales = [];
        for (let i = 1; i <= pdfDocument.numPages; i++) {
            const page = await pdfDocument.getPage(i);
            const textContent = await page.getTextContent();
            const filas = [];

            for (const item of textContent.items) {
                const texto = item.str.trim();
                if (!texto) continue;
                const x = item.transform[4];
                const y = item.transform[5];

                let fila = filas.find(f => Math.abs(f.y - y) <= 3);
                if (!fila) {
                    fila = { y, items: [] };
                    filas.push(fila);
                }
                fila.items.push({ x, texto });
            }

            filas.sort((a, b) => b.y - a.y);
            for (const fila of filas) {
                fila.items.sort((a, b) => a.x - b.x);
                lineasTotales.push(fila.items.map(it => it.texto).join(" "));
            }
        }
        return lineasTotales;
    }

    function procesarLineasRuta(lineas) {
        mapaRuta.clear();
        let bufferTexto = [];

        for (const linea of lineas) {
            if (/^(Ruta:|#\s+Nombre|Compartido a través)/i.test(linea)) continue;

            const matchBR = linea.match(/\b(BR[0-9A-Z]{13})\b/i);
            if (matchBR) {
                const codigoBR = matchBR[1].toUpperCase();
                const textoParada = bufferTexto.join(" ")
                    .replace(/(\s+-\s*)+$/g, "")
                    .trim();

                const matchNum = textoParada.match(/^(\d{1,3})\s+(.*)$/);
                const numParada = matchNum ? Number(matchNum[1]) : (mapaRuta.size + 1);
                let detalle = matchNum ? matchNum[2] : textoParada;

                let refShopee = "";
                const matchRef = detalle.match(/^(\d{1,3}\s*\/\s*\d{1,3})\s*\/\s*(.*)$/);
                if (matchRef) {
                    refShopee = matchRef[1].replace(/\s+/g, "");
                    detalle = matchRef[2];
                }

                const dirPDF = detalle.replace(/\.{2,}\s*$/, "").trim();

                mapaRuta.set(codigoBR, {
                    parada: numParada,
                    refShopee,
                    dirPDF,
                    dirCompleta: dirPDF,
                    bairro: "",
                    lat: null,
                    lon: null,
                    grupoId: "",
                    escaneado: false
                });

                bufferTexto = [];
            } else {
                bufferTexto.push(linea);
            }
        }

        enriquecerYAgrupar();
        guardarEstado();
        actualizarUIProgreso();
        actualizarEstadoCargaUI();
    }

    // ---------------- ALGORITMO "SENTIDO COMÚN" (TEXTO + GPS + NÚMERO) ----------------
    function parsearDireccionInteligente(texto) {
        let limpio = String(texto || "")
            .replace(/(\d)\.(\d)/g, "$1$2")
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .toLowerCase();

        limpio = limpio
            .replace(/^(rua|r\.|r|avenida|av\.|av|travessa|tv\.|alameda|al\.|rodovia|rod\.|estrada|est\.|praca|pca\.|largo|viela|beco)\s+/i, "")
            .trim();

        let calle = "";
        let num = null;
        const mComa = limpio.match(/^([^,]+),\s*(\d+)\b/);
        if (mComa) {
            calle = mComa[1];
            num = mComa[2];
        } else {
            const mEsp = limpio.match(/^(.+?)\s+(\d+)\b/);
            if (mEsp) {
                calle = mEsp[1];
                num = mEsp[2];
            } else {
                calle = limpio.split(",")[0];
            }
        }

        calle = calle
            .replace(/schimidt/g, "schmidt")
            .replace(/[^a-z0-9\s]/g, " ")
            .replace(/\s+/g, " ")
            .trim();

        const rawAntesComa = limpio.split(",")[0];
        const callePrincipal = rawAntesComa.split("-")[0]
            .replace(/schimidt/g, "schmidt")
            .replace(/[^a-z0-9\s]/g, " ")
            .replace(/\s+/g, " ")
            .trim();

        return {
            calle: callePrincipal || calle,
            calleFull: calle,
            num
        };
    }

    function similitudBigrams(a, b) {
        if (!a || !b) return 0;
        if (a === b) return 1;
        if (a.length < 2 || b.length < 2) return 0;
        if (a.includes(b) || b.includes(a)) return 0.92;

        const getBigrams = (s) => {
            const set = new Map();
            for (let i = 0; i < s.length - 1; i++) {
                const bg = s.slice(i, i + 2);
                set.set(bg, (set.get(bg) || 0) + 1);
            }
            return set;
        };
        const bgA = getBigrams(a);
        const bgB = getBigrams(b);
        let inter = 0;
        for (const [bg, count] of bgA.entries()) {
            if (bgB.has(bg)) inter += Math.min(count, bgB.get(bg));
        }
        return (2 * inter) / ((a.length - 1) + (b.length - 1));
    }

    function distanciaMetros(lat1, lon1, lat2, lon2) {
        if (lat1 === null || lon1 === null || lat2 === null || lon2 === null) return Infinity;
        const R = 6371000;
        const toRad = (g) => g * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function enriquecerYAgrupar() {
        const items = [];
        for (const [codigo, datos] of mapaRuta.entries()) {
            const ex = mapaExcel.get(codigo);
            if (ex) {
                datos.dirCompleta = ex.address || datos.dirPDF;
                datos.bairro = ex.bairro || "";
                datos.lat = ex.lat;
                datos.lon = ex.lon;
            } else {
                datos.dirCompleta = datos.dirPDF;
            }
            const parsed = parsearDireccionInteligente(datos.dirCompleta);
            items.push({ codigo, datos, parsed });
        }

        const n = items.length;
        const padre = Array.from({ length: n }, (_, i) => i);
        const find = (x) => (padre[x] === x ? x : (padre[x] = find(padre[x])));
        const union = (a, b) => {
            const ra = find(a), rb = find(b);
            if (ra !== rb) padre[rb] = ra;
        };

        for (let i = 0; i < n; i++) {
            for (let j = i + 1; j < n; j++) {
                const A = items[i], B = items[j];
                const numA = A.parsed.num, numB = B.parsed.num;

                if (numA !== null && numB !== null && numA !== numB) continue;

                const sim = similitudBigrams(A.parsed.calle, B.parsed.calle);
                const dist = distanciaMetros(A.datos.lat, A.datos.lon, B.datos.lat, B.datos.lon);

                let sonMismoLugar = false;
                if (numA !== null && numA === numB) {
                    if (sim >= 0.72 || dist <= 45) sonMismoLugar = true;
                } else if (numA === null && numB === null) {
                    if (sim >= 0.85 || dist <= 18) sonMismoLugar = true;
                } else {
                    if (sim >= 0.88 && dist <= 30) sonMismoLugar = true;
                    else if (dist <= 12) sonMismoLugar = true;
                }

                if (sonMismoLugar) union(i, j);
            }
        }

        mapaGrupos.clear();
        for (let i = 0; i < n; i++) {
            const root = find(i);
            const gId = `grp_${root}`;
            items[i].datos.grupoId = gId;

            if (!mapaGrupos.has(gId)) {
                mapaGrupos.set(gId, { count: 0, paradas: [], codigos: [] });
            }
            const grp = mapaGrupos.get(gId);
            grp.count += 1;
            grp.paradas.push(items[i].datos.parada);
            grp.codigos.push(items[i].codigo);
        }

        for (const grp of mapaGrupos.values()) {
            grp.paradas.sort((a, b) => a - b);
        }
    }

    // ---------------- COMPLEMENTOS Y ALERTAS ----------------
    function extraerBlocoApto(texto) {
        const mBl = texto.match(/\b(?:bloco|bl\.?)\s*([0-9A-Za-z]+)/i);
        const mAp = texto.match(/\b(?:apartamento|apto\.?|apt\.?|ap\.?)\s*([0-9A-Za-z]+)/i);
        const partes = [];
        if (mBl) partes.push(`Bloco ${mBl[1].toUpperCase()}`);
        if (mAp) partes.push(`Apto ${mAp[1].toUpperCase()}`);
        return partes.join(" / ");
    }

    function detectarAlertas(texto) {
        const alertas = [];
        const t = texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        if (/\b(comercio|comercial|horario|loja|padaria|salao|lanchonete|escola|mercado|seg a sex|segunda)\b/.test(t)) {
            alertas.push({ texto: "🏢 COMERCIO / HORARIO", tipo: "" });
        }
        if (/\b(condominio|cond\.|conde\.|bloco|bl\s*\d|apto|apartamento|portaria)\b/.test(t)) {
            alertas.push({ texto: "🏘️ CONDOMINIO", tipo: "" });
        }
        if (/\b(nao jogar|não jogar|quintal|portao|fundo|frente|placa|entregar|vizinho)\b/.test(t)) {
            alertas.push({ texto: "⚠️ LEER NOTA", tipo: "nota" });
        }
        return alertas;
    }

    // ---------------- PERSISTENCIA ----------------
    function guardarEstado() {
        try {
            localStorage.setItem(STORAGE_RUTA, JSON.stringify(Array.from(mapaRuta.entries())));
            localStorage.setItem(STORAGE_EXCEL, JSON.stringify(Array.from(mapaExcel.entries())));
        } catch (e) {
            console.warn("No se pudo guardar en localStorage:", e);
        }
    }

    function restaurarEstado() {
        try {
            const rawEx = localStorage.getItem(STORAGE_EXCEL);
            if (rawEx) mapaExcel = new Map(JSON.parse(rawEx));

            const rawRuta = localStorage.getItem(STORAGE_RUTA);
            if (rawRuta) {
                const entries = JSON.parse(rawRuta);
                if (Array.isArray(entries) && entries.length > 0) {
                    mapaRuta = new Map(entries);
                    enriquecerYAgrupar();
                    actualizarUIProgreso();
                    actualizarEstadoCargaUI(true);
                }
            } else if (mapaExcel.size > 0) {
                actualizarEstadoCargaUI(true);
            }
        } catch (e) {
            console.warn("Error restaurando estado:", e);
        }
    }

    function actualizarEstadoCargaUI(restaurado = false) {
        const estadoEl = document.getElementById("estadoCarga");
        if (mapaRuta.size === 0 && mapaExcel.size === 0) {
            estadoEl.innerText = "Esperando archivos...";
            estadoEl.style.color = "#9ca3af";
            return;
        }

        let cruzados = 0;
        for (const cod of mapaRuta.keys()) {
            if (mapaExcel.has(cod)) cruzados++;
        }

        const partes = [];

            partes.push(`${restaurado ? "♻️" : "✅"} PDF: ${mapaRuta.size} paquetes (${mapaGrupos.size} direcciones)`);
        }
        if (mapaExcel.size > 0) {
            partes.push(`📊 Excel: ${mapaExcel.size} filas` + (mapaRuta.size > 0 ? ` (${cruzados} cruzados con GPS)` : ""));
        }

    function limpiarRuta() {
        if (mapaRuta.size === 0 && mapaExcel.size === 0) return;
        if (!confirm("¿Seguro que quieres borrar la ruta, el Excel y todo el progreso?")) return;
        mapaRuta.clear();
        mapaExcel.clear();
        mapaGrupos.clear();

        localStorage.removeItem(STORAGE_EXCEL);

    function actualizarUIProgreso() {

        for (const d of mapaRuta.values()) {

        }

    // ---------------- PROCESAMIENTO DE LECTURA ----------------
    function buscarCodigoEnRuta(codigoRaw) {
        const limpio = codigoRaw.trim().toUpperCase();
        if (mapaRuta.has(limpio)) return { codigo: limpio, datos: mapaRuta.get(limpio) };

        const matchSub = limpio.match(/\b(BR[0-9A-Z]{13})\b/);
        if (matchSub && mapaRuta.has(matchSub[1])) {
            return { codigo: matchSub[1], datos: mapaRuta.get(matchSub[1]) };
        }

        const norm = (s) => s.replace(/S/g, "5").replace(/O/g, "0");
        const buscadoNorm = norm(matchSub ? matchSub[1] : limpio);
        for (const [cod, datos] of mapaRuta.entries()) {
            if (norm(cod) === buscadoNorm) return { codigo: cod, datos };
        }
        return null;
    }

    function procesarLectura(codigoRaw, esManual = false) {
        const ahora = Date.now();
        const codigoTrim = codigoRaw.trim().toUpperCase();

        if (!esManual) {
            if (codigoTrim === ultimoCodigoLeido && (ahora - ultimoTiempoLeido) < COOLDOWN_MS) return;
            ultimoCodigoLeido = codigoTrim;
            ultimoTiempoLeido = ahora;
        }

        const caja = document.getElementById("resultado");

        if (mapaRuta.size === 0) {
            caja.className = "rojo";
            caja.innerHTML = `<div class="parada-num">SUBE TU PDF</div><div class="info-guia">Primero carga el PDF de Routin</div>`;
            emitirBeep("error");
            return;
        }

        const encontrado = buscarCodigoEnRuta(codigoTrim);
        if (!encontrado) {
            caja.className = "rojo";
            caja.innerHTML = `<div class="parada-num">NO ESTÁ EN RUTA</div><div class="info-guia">${esc(codigoTrim)}</div>`;
            emitirBeep("error");
            if (navigator.vibrate) navigator.vibrate(250);
            return;
        }

        const { codigo, datos } = encontrado;
        const yaEstabaEscaneado = datos.escaneado;

        if (!yaEstabaEscaneado) {
            datos.escaneado = true;
            guardarEstado();
            actualizarUIProgreso();
        }

        const grp = mapaGrupos.get(datos.grupoId);
        const totalBultos = grp ? grp.count : 1;
        const zona = obtenerZonaFiorino(datos.parada, mapaRuta.size);
        const blocoApto = extraerBlocoApto(datos.dirCompleta);
        const alertas = detectarAlertas(datos.dirCompleta);

        let escaneadosDir = 0;
        let mismosApto = 0;
        let chipsHtml = "";

        if (grp && totalBultos > 1) {
            for (const codGrp of grp.codigos) {
                const pkg = mapaRuta.get(codGrp);
                if (!pkg) continue;
                if (pkg.escaneado) escaneadosDir++;
                if (blocoApto && codGrp !== codigo && extraerBlocoApto(pkg.dirCompleta) === blocoApto) {
                    mismosApto++;
                }
            }
            const ordenados = grp.codigos
                .map(c => mapaRuta.get(c))
                .filter(Boolean)
                .sort((a, b) => a.parada - b.parada);
            for (const pkg of ordenados) {
                chipsHtml += `<span class="chip-parada ${pkg.escaneado ? "ok" : ""}">#${pkg.parada}${pkg.escaneado ? " ✓" : ""}</span>`;
            }
        }

        const alertasHtml = alertas.length > 0
            ? `<div class="alertas-row">${alertas.map(a => `<span class="alerta-pill ${a.tipo}">${a.texto}</span>`).join("")}</div>`
            : "";

        const avisoMismoApto = mismosApto > 0
            ? `<div style="font-size:0.82rem; color:#bbf7d0; margin-top:4px;">📌 Hay ${mismosApto + 1} bultos para este mismo ${esc(blocoApto)}</div>`
            : "";

        const bultosHtml = totalBultos > 1
            ? `<div class="info-bultos">
                    📦 ${escaneadosDir} de ${totalBultos} BULTOS EN ESTA DIRECCIÓN
                    ${avisoMismoApto}
                    <div class="bultos-paradas">${chipsHtml}</div>
               </div>`
            : `<div class="info-bultos" style="color:#d1fae5;">📦 1 bulto único en esta dirección</div>`;

        const gpsBtnHtml = (datos.lat !== null && datos.lon !== null)
            ? `<a class="btn-mini" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${datos.lat},${datos.lon}">📍 Pin</a>`
            : "";

        caja.className = yaEstabaEscaneado ? "ambar" : "verde";
        caja.innerHTML = `
            <div class="res-top">
                <div class="parada-num">PARADA N° ${datos.parada}</div>
                <div class="zona-badge" style="background:${zona.color};">${zona.texto}</div>
            </div>
            ${yaEstabaEscaneado
                ? `<div class="estado-tag">⚠️ YA ESCANEADO ANTERIORMENTE</div>`
                : `<div class="estado-tag">✅ REGISTRADO EN CARGA</div>`}
            ${alertasHtml}
            ${bultosHtml}
            <div class="info-direccion">
                ${blocoApto ? `<div style="color:#fde047; font-size:1.05rem; margin-bottom:2px;">📍 ${esc(blocoApto)}</div>` : ""}
                ${datos.refShopee ? `<span style="opacity:0.8">[${esc(datos.refShopee)}]</span> ` : ""}${esc(datos.dirCompleta)}
            </div>
            ${datos.bairro ? `<div class="info-bairro">${esc(datos.bairro)}</div>` : ""}
            <div class="info-guia">${esc(codigo)}</div>
            <div class="quick-actions">
                <button class="btn-mini" onclick="copiarMensaje(this, '${esc(codigo)}', 'camino')">💬 Camino</button>
                <button class="btn-mini" onclick="copiarMensaje(this, '${esc(codigo)}', 'puerta')">💬 Puerta</button>
                <button class="btn-mini" onclick="copiarMensaje(this, '${esc(codigo)}', 'ausente')">💬 Ausente</button>
                ${gpsBtnHtml}
                <button class="btn-mini" onclick="desmarcarPaquete('${esc(codigo)}')">Desmarcar</button>
            </div>
        `;

        if (yaEstabaEscaneado) {
            emitirBeep("duplicado");
            if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
        } else if (totalBultos > 1) {
            emitirBeep("multi");
            if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
        } else {
            emitirBeep("ok");
            if (navigator.vibrate) navigator.vibrate(150);
        }
    }

    // ---------------- COPIADO RÁPIDO DE MENSAJES (CON Cód:) ----------------
    async function copiarMensaje(btn, codigo, tipo) {
        const datos = mapaRuta.get(codigo);
        if (!datos) return;

        const cod4 = codigo.slice(-4);
        let msg = "";
        if (tipo === "camino") {
            msg = `Olá! Sou entregador da Shopee e estou a caminho do seu endereço agora. Por favor, fique atento(a) para receber o seu pedido. Cód: ${cod4}`;
        } else if (tipo === "puerta") {
            msg = `Olá! Sou entregador da Shopee e já estou aqui na frente (ou portaria) com o seu pedido. Pode vir receber, por favor? Cód: ${cod4}`;
        } else {
            msg = `Olá! Chamei no seu endereço com sua entrega da Shopee, mas não recebi resposta. Deseja que algum vizinho receba por você? Se sim, me informe o número da casa, por favor. Cód: ${cod4}`;
        }

        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(msg);
            } else {
                const ta = document.createElement("textarea");
                ta.value = msg;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
            }
            const textoOriginal = btn.innerText;
            btn.innerText = "✅ Copiado";
            btn.classList.add("copiado");
            setTimeout(() => {
                btn.innerText = textoOriginal;
                btn.classList.remove("copiado");
            }, 1400);
        } catch (e) {
            alert("Mensaje listo:\n\n" + msg);
        }
    }

    // ---------------- BÚSQUEDA MANUAL ----------------
    function buscarManual(texto) {
        const cont = document.getElementById("busquedaResultados");
        const q = texto.trim().toUpperCase();
        if (q.length < 2 || mapaRuta.size === 0) {
            cont.innerHTML = "";
            return;
        }

        const coincidencias = [];
        for (const [codigo, datos] of mapaRuta.entries()) {
            const enCodigo = codigo.includes(q);
            const enDir = datos.dirCompleta.toUpperCase().includes(q);
            const enParada = String(datos.parada) === q;
            if (enCodigo || enDir || enParada) coincidencias.push({ codigo, datos });
            if (coincidencias.length >= 6) break;
        }

        if (coincidencias.length === 0) {
            cont.innerHTML = `<div style="font-size:0.82rem; color:#9ca3af;">Sin coincidencias...</div>`;
            return;
        }

        cont.innerHTML = coincidencias.map(({ codigo, datos }) => `
            <div class="busqueda-item">
                <div class="lista-row-info">
                    <strong>#${datos.parada}</strong> ${datos.escaneado ? "✅" : "⏳"} - ${esc(datos.dirCompleta.slice(0, 50))}
                    <div style="font-size:0.75rem; color:#9ca3af; font-family:monospace;">${esc(codigo)}</div>
                </div>
                <button onclick="seleccionarManual('${esc(codigo)}')">Ubicar</button>
            </div>
        `).join("");
    }

    function renderizarListaModal() {
        actualizarContadoresTabs();
        const cont = document.getElementById("listaModalContenido");
        const filtro = document.getElementById("filtroModal").value.trim().toUpperCase();

        // Vista agrupada limpia para Multibulto
        if (tabActual === "multi") {
            const grupos = [];
            for (const [gId, grp] of mapaGrupos.entries()) {
                if (grp.count <= 1) continue;
                const paquetes = grp.codigos
                    .map(c => ({ codigo: c, ...mapaRuta.get(c) }))
                    .sort((a, b) => a.parada - b.parada);

                if (filtro) {
                    const hayMatch = paquetes.some(p =>
                        p.codigo.includes(filtro) ||
                        p.dirCompleta.toUpperCase().includes(filtro) ||
                        String(p.parada) === filtro
                    );
                    if (!hayMatch) continue;
                }
                grupos.push({ gId, paquetes, primeraParada: paquetes[0].parada });
            }

            grupos.sort((a, b) => a.primeraParada - b.primeraParada);

            if (grupos.length === 0) {
                cont.innerHTML = `<div style="text-align:center; color:#9ca3af; padding:20px;">No hay direcciones con múltiples bultos.</div>`;
                return;
            }

            cont.innerHTML = grupos.map(g => {
                const cargados = g.paquetes.filter(p => p.escaneado).length;
                const total = g.paquetes.length;
                const dirMuestra = g.paquetes[0].dirCompleta.split(",").slice(0, 2).join(",");
                const chipsParadas = g.paquetes.map(p => `#${p.parada}${p.escaneado ? "✓" : ""}`).join(", ");

                const filasHtml = g.paquetes.map(item => `
                    <div class="lista-row">
                        <div class="lista-row-info">
                            <strong>Parada #${item.parada}</strong> ${item.escaneado ? "✅" : "⏳"}
                            <div>${esc(item.dirCompleta)}</div>
                            <small>${esc(item.codigo)}</small>
                        </div>
                        <button class="btn-icon" onclick="${item.escaneado ? `desmarcarPaquete('${esc(item.codigo)}')` : `procesarLectura('${esc(item.codigo)}', true); renderizarListaModal();`}">
                            ${item.escaneado ? "Quitar" : "Cargar"}
                        </button>
                    </div>
                `).join("");

                return `
                    <details class="multi-group">
                        <summary>
                            <div class="multi-summary-top">
                                <span>📦 ${total} bultos (${cargados}/${total})</span>
                                <span style="color:#9ca3af; font-size:0.75rem;">Tocar para ver ▼</span>
                            </div>
                            <div><strong>${esc(dirMuestra)}</strong></div>
                            <div class="multi-summary-sub">Paradas: ${esc(chipsParadas)}</div>
                        </summary>
                        <div class="multi-group-body">${filasHtml}</div>
                    </details>
                `;
            }).join("");
            return;
        }

        // Vista estándar para Faltantes / Cargados
        const items = Array.from(mapaRuta.entries())
            .map(([codigo, datos]) => ({ codigo, ...datos }))
            .sort((a, b) => a.parada - b.parada)
            .filter(item => {
                if (tabActual === "faltantes" && item.escaneado) return false;
                if (tabActual === "cargados" && !item.escaneado) return false;
                if (!filtro) return true;
                return (
                    item.codigo.includes(filtro) ||
                    item.dirCompleta.toUpperCase().includes(filtro) ||
                    String(item.parada) === filtro
                );
            });

        if (items.length === 0) {
            cont.innerHTML = `<div style="text-align:center; color:#9ca3af; padding:20px;">No hay paquetes en esta vista.</div>`;
            return;
        }

        cont.innerHTML = items.map(item => {
            const grp = mapaGrupos.get(item.grupoId);
            const multiTag = (grp && grp.count > 1) ? ` • 📦 x${grp.count}` : "";
            return `
                <div class="lista-row">
                    <div class="lista-row-info">
                        <strong>Parada #${item.parada}${multiTag}</strong> ${item.escaneado ? "✅" : ""}
                        <div>${esc(item.dirCompleta)}</div>
                        <small>${esc(item.codigo)}</small>
                    </div>
                    <button class="btn-icon" onclick="${item.escaneado ? `desmarcarPaquete('${esc(item.codigo)}')` : `procesarLectura('${esc(item.codigo)}', true); renderizarListaModal();`}">
                        ${item.escaneado ? "Quitar" : "Cargar"}
                    </button>
                </div>
            `;
        }).join("");
    }

    // ---------------- CÁMARA Y LINTERNA ----------------
    async function iniciarEscaner() {
        if (isScannerRunning || scannerBusy || scannerPausadoManual) return;
        scannerBusy = true;

        try {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader", {
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.QR_CODE,
                        Html5QrcodeSupportedFormats.CODE_128
                    ],
                    experimentalFeatures: {
                        useBarCodeDetectorIfSupported: true
                    }
                });
            }

            await html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 12,
                    qrbox: (w, h) => {
                        const lado = Math.min(250, Math.floor(Math.min(w, h) * 0.72));
                        return { width: lado, height: lado };
                    }
                },
                (decodedText) => procesarLectura(decodedText, false),
                () => {}
            );
            isScannerRunning = true;
            linternaActiva = false;
            document.getElementById("btnLinterna").classList.remove("activo");
        } catch (err) {
            console.warn("No se pudo iniciar cámara:", err);
            isScannerRunning = false;
        } finally {
            scannerBusy = false;
        }
    }

    async function detenerEscaner() {
        if (!isScannerRunning || scannerBusy || !html5QrCode) return;
        scannerBusy = true;
        try {
            await html5QrCode.stop();
        } catch (e) {
        } finally {
            isScannerRunning = false;
            linternaActiva = false;
            document.getElementById("btnLinterna").classList.remove("activo");
            scannerBusy = false;
        }
    }

    async function togglePausaCamara() {
        const btn = document.getElementById("btnPausa");
        if (scannerPausadoManual) {
            scannerPausadoManual = false;
            btn.innerText = "⏸️ Pausar";
            btn.classList.remove("activo");
            await iniciarEscaner();
        } else {
            scannerPausadoManual = true;
            btn.innerText = "▶️ Reanudar";
            btn.classList.add("activo");
            await detenerEscaner();
        }
    }

    async function toggleLinterna() {
        if (!isScannerRunning || !html5QrCode) return;
        const nuevoEstado = !linternaActiva;
        try {
            await html5QrCode.applyVideoConstraints({
                advanced: [{ torch: nuevoEstado }]
            });
            linternaActiva = nuevoEstado;
            document.getElementById("btnLinterna").classList.toggle("activo", linternaActiva);
        } catch (e) {
            alert("Tu navegador o cámara no permite controlar la linterna desde la web.");
        }
    }

    document.addEventListener("visibilitychange", async () => {
        if (document.hidden) {
            await detenerEscaner();
        } else if (!scannerPausadoManual) {
            setTimeout(() => iniciarEscaner(), 300);
        }
    });

    window.addEventListener("DOMContentLoaded", () => {
        restaurarEstado();
        iniciarEscaner();
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").catch(() => {});
        }
    });
</script>
